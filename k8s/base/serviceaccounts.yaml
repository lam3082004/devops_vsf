# Tên + namespace ở đây phải khớp subject của federated credential trong
# infra/aks/identity.tf (system:serviceaccount:opsboard:be / :fe).
#
# Không có annotation azure.workload.identity/client-id: app không tự gọi Azure. Người
# dùng danh tính là driver CSI, và nó lấy client id từ SecretProviderClass.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: be
  labels:
    app.kubernetes.io/name: be
    app.kubernetes.io/part-of: opsboard
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fe
  labels:
    app.kubernetes.io/name: fe
    app.kubernetes.io/part-of: opsboard
automountServiceAccountToken: false
