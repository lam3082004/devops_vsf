# Số pod của `be`. maxReplicas 2 là luật project ("autoscale tối đa 2 instance"). 70% tính trên CPU
# REQUEST của container, cùng ngưỡng scale out với autoscale của App Service Plan.
#
# minReplicas 2 (từ 12/10, trước đó là 1): với 1 bản, lần cluster autoscaler gỡ node đang giữ bản
# đó là một lần gián đoạn (đo được: be 503 trong 9 giây — xem pdb.yaml). Dưới trần 2 của luật
# project, sàn 2 nghĩa là số pod cố định: HPA đã được đo co giãn 1 → 2 → 1 với min 1
# (evidence/advanced/aks-m7.md mục 1), còn từ nay phần co giãn nằm ở tầng node (1–2).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: be
  labels:
    app.kubernetes.io/name: be
    app.kubernetes.io/part-of: opsboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: be
  minReplicas: 2
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
