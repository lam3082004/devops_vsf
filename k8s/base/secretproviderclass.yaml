# Key Vault → pod, không secret nào viết tay (tương đương M4/M5).
#
# Driver CSI xin token cho ServiceAccount của pod, đổi lấy token của managed identity
# (clientID dưới đây) rồi đọc secret từ Key Vault lúc MOUNT volume. Mất quyền trên Key
# Vault thì mount thất bại và pod kẹt ở ContainerCreating — đó là chứng minh ngược M5.
#
# secretObjects: app chỉ đọc biến môi trường (app/be/Infrastructure/Config.cs), nên driver
# chép giá trị sang một Secret của Kubernetes để Deployment dùng secretKeyRef. Secret đó
# chỉ tồn tại khi còn pod mount volume, và không nằm trong git hay Terraform state.
#
# clientID / keyvaultName / tenantId là chỗ giữ chỗ — scripts/aks-render.sh thay.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: be-secrets
spec:
  provider: azure
  secretObjects:
    - secretName: be-secrets
      type: Opaque
      data:
        - objectName: mysql-admin-password
          key: DB_PASSWORD
        - objectName: aks-appinsights-connection-string
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
  parameters:
    usePodIdentity: "false"
    clientID: "00000000-0000-0000-0000-000000000000"
    keyvaultName: "placeholder"
    tenantId: "00000000-0000-0000-0000-000000000000"
    objects: |
      array:
        - |
          objectName: mysql-admin-password
          objectType: secret
        - |
          objectName: aks-appinsights-connection-string
          objectType: secret
---
# `fe` có danh tính riêng và chỉ đọc đúng một secret — không chạm mật khẩu DB.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fe-secrets
spec:
  provider: azure
  secretObjects:
    - secretName: fe-secrets
      type: Opaque
      data:
        - objectName: aks-appinsights-connection-string
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
  parameters:
    usePodIdentity: "false"
    clientID: "00000000-0000-0000-0000-000000000000"
    keyvaultName: "placeholder"
    tenantId: "00000000-0000-0000-0000-000000000000"
    objects: |
      array:
        - |
          objectName: aks-appinsights-connection-string
          objectType: secret
