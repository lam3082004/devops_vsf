name: CI — AKS (advanced)

# Phần ADVANCED, ngoài topic.md. File riêng, không sửa ci.yml; KHÔNG nằm trong danh sách
# required check của ruleset protect-main (ruleset giữ nguyên 9 check của bài chính).
#
# Chỉ chạy khi PR đụng tới phần AKS. Các cổng chung của ci.yml vẫn tự phủ file mới:
# gitleaks, terraform fmt + validate (lặp qua infra/*/), trivy config trên cả repo.
on:
  pull_request:
    branches: [main]
    paths:
      - "infra/aks/**"
      - "k8s/**"
      - "scripts/aks-*.sh"
      - ".github/workflows/ci-aks.yml"

permissions:
  contents: read

concurrency:
  group: ci-aks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: aks manifests (kustomize, kubeconform, shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cài kubeconform ${{ env.KUBECONFORM_VERSION }}
        env:
          KUBECONFORM_VERSION: 0.7.0
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      # Build đúng thứ `make aks-deploy` build (trừ phần giá trị riêng môi trường): manifest
      # sai cú pháp kustomize thì đỏ ở đây, không phải lúc đang deploy.
      - name: kustomize build
        run: kubectl kustomize k8s/base > "$RUNNER_TEMP/rendered.yaml"

      # -strict: field lạ (gõ sai tên) là lỗi — kubectl apply phía client không bắt được.
      # Bỏ qua SecretProviderClass: là CRD của add-on Key Vault CSI, không có trong bộ
      # schema chuẩn của Kubernetes.
      - name: kubeconform (Kubernetes 1.35, strict)
        run: |
          kubeconform -strict -summary -kubernetes-version 1.35.0 \
            -skip SecretProviderClass "$RUNNER_TEMP/rendered.yaml"

      - name: shellcheck scripts/aks-*.sh
        run: shellcheck scripts/aks-*.sh

  terraform-plan-aks:
    name: terraform plan (infra/aks)
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    # Cùng lý do với terraform-plan-infra-app của ci.yml: xếp hàng theo tên cố định.
    concurrency:
      group: terraform-plan-infra-aks
      cancel-in-progress: false
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
      - name: terraform init
        run: terraform -chdir=infra/aks init -backend-config=backend.hcl

      # -lock=false: id-gh-plan chỉ có Storage Blob Data Reader (review 30/09 #1).
      #
      # infra/aks cần môi trường nền (infra/app) đang bật — nó tra ACR/Key Vault/MySQL bằng
      # data source. Môi trường nền tắt thì plan không chạy được: báo notice và để job
      # XANH (như nhánh "partial" của ci.yml), còn mọi lỗi khác thì đỏ.
      - name: terraform plan
        id: plan
        run: |
          set -uo pipefail
          # Che IP ngay ở luồng in ra log của job, không chỉ ở plan.txt (review 12/10 #8).
          terraform -chdir=infra/aks plan -no-color -input=false -lock=false -out=tfplan 2>&1 \
            | sed -u -E 's/([0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}\.[0-9]{1,3}/\1.x.x/g' | tee plan.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
          elif grep -q -e "Dựng môi trường nền trước" -e "ResourceGroupNotFound" plan.log; then
            echo "scope=skipped" >> "$GITHUB_OUTPUT"
            echo "::notice::Moi truong nen (rg-vsf-dev) dang tat — khong plan duoc infra/aks. Chay 'make up' roi re-run job."
          else
            exit "$rc"
          fi

      # Chỉ file TEXT rời runner (tfplan nhị phân chứa connection string App Insights).
      # Che 2 octet cuối của mọi IPv4: CI không có tfvars nên plan in danh sách IP whitelist
      # đang có trong state ở dạng "sẽ xoá" — IP cá nhân không được nằm trong artifact.
      - name: Chuyển plan sang bản text đọc được trong PR
        run: |
          if [ "${{ steps.plan.outputs.scope }}" = "full" ]; then
            terraform -chdir=infra/aks show -no-color tfplan \
              | sed -E 's/([0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}\.[0-9]{1,3}/\1.x.x/g' > infra/aks/plan.txt
          else
            echo "Bo qua: moi truong nen dang tat." > infra/aks/plan.txt
          fi

      - name: Tóm tắt vào job summary
        run: |
          {
            echo "### Terraform plan — infra/aks (advanced)"
            echo '```'
            grep -E '^(Plan:|No changes|Bo qua)' infra/aks/plan.txt || echo "(không thấy dòng tóm tắt, xem plan.txt trong artifact)"
            echo '```'
            echo "CI không có \`terraform.tfvars\`: thay đổi ở \`authorized_ip_ranges\` là diff giả đã biết (infra/aks/variables.tf)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan.txt làm artifact
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-aks
          path: infra/aks/plan.txt
          retention-days: 14
