name: CD

# Chỉ chạy theo push vào main (merge PR) — deploy KHÔNG chạy theo pull_request,
# đó là việc của ci.yml. workflow_dispatch chỉ để chạy tay khi cần điều tra;
# nó vẫn bị chặn bởi cả ba lớp bảo vệ mô tả ở job `preflight` bên dưới, nên
# không phải một cửa hậu.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Token cần đọc nội dung (checkout) và ghi id-token (OIDC vào Azure) — mọi job
# trong file này đều đăng nhập Azure nên khai ở cấp workflow, không lặp lại
# từng job như ci.yml (ci.yml chỉ có một job cần OIDC).
permissions:
  contents: read
  id-token: write

# MỘT nhóm deploy DUY NHẤT cho toàn bộ pipeline — khác ci-terraform-plan (nhóm
# theo ref) và khác ci chính (nhóm theo ref, huỷ được): ở đây hai lần merge
# liên tiếp vào main phải XẾP HÀNG, không được chạy chồng lên nhau.
#
# cancel-in-progress: false là CỐ Ý, ngược hẳn với ci.yml. Swap slot không phải
# thao tác nguyên tử theo góc nhìn người quan sát: nếu merge thứ hai huỷ ngang
# lúc merge thứ nhất đang swap be/fe, production có thể dừng lại ở trạng thái
# không ai biết — production trỏ bản A trong khi slot đang trỏ bản B (hoặc
# be đã swap mà fe thì chưa), và biết được sự thật chỉ bằng cách đi đọc từng
# app một. Chờ thì chậm hơn nhưng luôn kết thúc ở một trạng thái xác định được.
# Ở CI thì ngược lại: huỷ một lần build dở dang không để lại hậu quả nào, nên
# cancel-in-progress: true ở đó là đúng.
concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # preflight — CỐ Ý KHÔNG khai `environment:`. Đây là quyết định quan trọng
  # nhất của file này, vì hai lý do:
  #
  # (a) Environment protection (required reviewer, deployment branch policy)
  #     áp dụng ở CẤP JOB, không phải cấp workflow. Nếu để `preflight` nằm
  #     trong một environment thì MỌI push vào main — kể cả PR chỉ sửa tài
  #     liệu — đều sinh ra một job đang chờ, và nếu environment đó có required
  #     reviewer thì thành một yêu cầu duyệt TREO, dù rg-vsf-dev đang tắt
  #     (kỷ luật `make down`) và chẳng có gì để deploy cả. Tách preflight ra
  #     ngoài environment thì các PR loại đó đi qua êm: job chạy, tự nhận ra
  #     môi trường trống, kết thúc XANH, không ai phải bấm gì.
  #
  # (b) Job KHÔNG có `environment` thì subject của token OIDC mà GitHub phát
  #     hành là `repo:<org>/<repo>:ref:refs/heads/main` (xem
  #     infra/bootstrap/cicd.tf, azurerm_federated_identity_credential.gh_deploy_main,
  #     subject = "repo:${var.github_repo}:ref:refs/heads/main"). Đây chính là
  #     LỚP BẢO VỆ THỨ BA của "chỉ main được deploy" — chạy tay
  #     (workflow_dispatch) từ một nhánh feat/... thì subject sinh ra là
  #     `repo:<org>/<repo>:ref:refs/heads/feat/...`, không khớp federated
  #     credential nào đã khai trong Terraform, Entra từ chối phát token, và
  #     `azure/login` ở bước dưới FAIL — cả pipeline dừng ngay tại đây.
  #
  #     Ngược lại, nếu job này có `environment: xxx`, subject đổi hẳn dạng
  #     thành `repo:<org>/<repo>:environment:xxx` — KHÔNG còn mã hoá tên nhánh
  #     trong subject nữa. Lúc đó việc chặn nhánh sai hoàn toàn dồn vào lớp 2
  #     (deployment branch policy của environment, cấu hình được ở GitHub, có
  #     thể sửa nhầm) mà mất luôn lớp 3 (federated credential, nằm ngoài
  #     GitHub, Entra là bên phán quyết cuối). Giữ preflight ngoài environment
  #     là giữ cho lớp 3 còn tác dụng thật, không chỉ trên giấy.
  # ==========================================================================
  preflight:
    name: preflight (soi moi truong, khong doi hoi duyet)
    runs-on: ubuntu-24.04
    outputs:
      should_deploy: ${{ steps.probe.outputs.should_deploy }}
      be_app: ${{ steps.probe.outputs.be_app }}
      fe_app: ${{ steps.probe.outputs.fe_app }}
      acr_name: ${{ steps.probe.outputs.acr_name }}
      acr_login_server: ${{ steps.probe.outputs.acr_login_server }}
    steps:
      # Không checkout: job này chỉ hỏi Azure, không đụng tới nội dung repo.
      - name: Đăng nhập Azure OIDC (id-gh-deploy)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # rg-vsf-dev THƯỜNG không tồn tại (kỷ luật make down cuối buổi, D8) — az
      # trả lỗi khi RG hoặc resource không có, phải tự bắt lỗi đó để job vẫn
      # XANH thay vì đỏ oan mỗi khi có PR tài liệu merge vào lúc môi trường tắt.
      # Vì vậy KHÔNG set -e ở đây: mỗi lệnh az tự chịu lỗi bằng `|| true`.
      - name: Soi môi trường, tra tên thật của be/fe/ACR
        id: probe
        run: |
          set -uo pipefail

          BE_APP=$(az webapp list -g rg-vsf-dev \
            --query "[?starts_with(name,'app-vsf-')].name" -o tsv 2>/dev/null | head -n1 || true)
          FE_APP=$(az webapp list -g rg-vsf-dev \
            --query "[?starts_with(name,'fe-vsf-')].name" -o tsv 2>/dev/null | head -n1 || true)
          ACR_NAME=$(az acr list -g rg-vsf-dev \
            --query "[?starts_with(name,'acrvsf')].name" -o tsv 2>/dev/null | head -n1 || true)

          ACR_LOGIN_SERVER=""
          if [ -n "$ACR_NAME" ]; then
            ACR_LOGIN_SERVER=$(az acr show -n "$ACR_NAME" -g rg-vsf-dev \
              --query loginServer -o tsv 2>/dev/null || true)
          fi

          echo "be_app=$BE_APP" >> "$GITHUB_OUTPUT"
          echo "fe_app=$FE_APP" >> "$GITHUB_OUTPUT"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

          # Ba mức: (1) trống hoàn toàn — môi trường đã make down, bình
          # thường; (2) thiếu MỘT trong hai app hoặc thiếu ACR — nửa môi
          # trường, nguy hiểm hơn môi trường trống vì trông như có thể deploy
          # được; (3) đủ cả ba — mới cho should_deploy=true. Viết bằng
          # if/elif/else tường minh, KHÔNG dùng `[ ... ] && VAR=...` làm luồng
          # điều khiển: dạng đó chạy đúng hôm nay chỉ vì thiếu `set -e`, ai
          # thêm `set -e` sau (hoặc dời dòng đó xuống cuối script) là lặng lẽ
          # biến nó thành một lệnh có thể fail.
          if [ -z "$BE_APP" ] && [ -z "$FE_APP" ]; then
            SHOULD_DEPLOY=false
            REASON="rg-vsf-dev dang trong (da make down, hoac chua make up) — khong co be lan fe de deploy. Chay 'make up' roi re-run workflow nay neu muon deploy commit nay."
          elif [ -z "$BE_APP" ] || [ -z "$FE_APP" ]; then
            SHOULD_DEPLOY=false
            if [ -z "$FE_APP" ]; then
              MISSING="fe (prefix fe-vsf-)"
            else
              MISSING="be (prefix app-vsf-)"
            fi
            REASON="moi truong rg-vsf-dev khong day du — thieu Web App $MISSING. Nua moi truong con nguy hiem hon moi truong trong nen bo qua deploy. Chay 'make up' de dam bao ca hai app roi re-run workflow nay."
          elif [ -z "$ACR_NAME" ]; then
            SHOULD_DEPLOY=false
            REASON="rg-vsf-dev co ca be va fe nhung khong tim thay ACR (prefix acrvsf) — moi truong khong day du, bo qua deploy. Chay 'make up' roi re-run workflow nay."
          else
            SHOULD_DEPLOY=true
            REASON=""
          fi

          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_DEPLOY" = "false" ]; then
            echo "::notice::$REASON"
          fi

          # Ghi lại vào job summary — đây là thứ được chụp làm bằng chứng cho
          # evidence/M10.md ("CD không chạy vào hư không"). `::notice::` trôi
          # mất trong log thô, không phải chỗ đáng tin để tra lại sau này.
          {
            echo "### CD — preflight"
            echo ""
            echo "| App | Tìm được |"
            echo "|---|---|"
            echo "| be (prefix app-vsf-) | \`${BE_APP:-(không có)}\` |"
            echo "| fe (prefix fe-vsf-) | \`${FE_APP:-(không có)}\` |"
            echo "| ACR (prefix acrvsf) | \`${ACR_NAME:-(không có)}\` |"
            echo ""
            echo "- should_deploy: \`$SHOULD_DEPLOY\`"
            if [ "$SHOULD_DEPLOY" = "false" ]; then
              echo "- Lý do bỏ qua: $REASON"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # build-deploy-staging — environment staging-deploy (không required reviewer,
  # chỉ giới hạn nhánh main). Chạy hoàn toàn tự động, không ai chạm vào.
  # ==========================================================================
  build-deploy-staging:
    name: build + push ACR + set image slot staging
    runs-on: ubuntu-24.04
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    environment: staging-deploy
    steps:
      - uses: actions/checkout@v5

      - name: Đăng nhập Azure OIDC (id-gh-deploy)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Đăng nhập ACR bằng danh tính Entra vừa login ở trên — KHÔNG dùng
      # admin user/password (ACR khai admin_enabled = false ở acr.tf, đúng M1).
      - name: Đăng nhập ACR bằng danh tính Entra
        env:
          ACR_NAME: ${{ needs.preflight.outputs.acr_name }}
        run: az acr login -n "$ACR_NAME"

      # Build cả hai image. CẢ HAI đều nhận --build-arg GIT_SHA: be nhúng vào
      # binary lúc dịch (OpsBoard.csproj, target EmbedGitSha) còn fe nhúng thành
      # ENV ở stage runtime cho route /api/version đọc lúc chạy. Thiếu cờ này ở
      # một trong hai thì service đó trả sha "dev" trên production, và triệu
      # chứng trông hệt như CD không deploy được.
      - name: Build image be + fe (đo thời gian)
        env:
          GIT_SHA: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ needs.preflight.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          T0=$(date +%s)
          docker build --build-arg GIT_SHA="$GIT_SHA" \
            -t "$ACR_LOGIN_SERVER/vsf-be:$GIT_SHA" app/be/
          T1=$(date +%s)
          docker build --build-arg GIT_SHA="$GIT_SHA" \
            -t "$ACR_LOGIN_SERVER/vsf-fe:$GIT_SHA" app/fe/
          T2=$(date +%s)
          echo "build-be: $((T1-T0))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"
          echo "build-fe: $((T2-T1))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"

      # Cache database CVE theo run_id — cùng lý do và cùng key scheme với
      # ci.yml: không tải lại ~700MB mỗi lần, nhưng không giữ quá lâu (dữ
      # liệu CVE đổi liên tục).
      - name: Cache database Trivy
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # Chạy thẳng binary ghim version, giống hệt ci.yml: giữ token của job
      # này (id-gh-deploy, đã có quyền ghi vào Azure) khỏi phải cấp thêm
      # quyền comment/upload cho một action bên thứ ba, và giữ kết quả quét
      # tái lập được giữa các lần chạy.
      - name: Cài trivy ${{ env.TRIVY_VERSION }}
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          curl -sSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # CỔNG, đúng chính sách CI (Q4, D14): CRITICAL,HIGH, KHÔNG --ignore-unfixed,
      # KHÔNG continue-on-error. Đây là image SẮP lên production, không phải
      # image thử nghiệm — quét lại ở đây không phải trang trí lặp lại việc
      # ci.yml đã làm, mà là chốt lần cuối trên đúng cái sắp push, vì layer
      # base image có thể đã có CVE mới xuất hiện giữa lúc PR được review và
      # lúc merge thật sự chạy build này.
      - name: Trivy — cổng CRITICAL/HIGH cho be + fe (đo thời gian)
        env:
          GIT_SHA: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ needs.preflight.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          T0=$(date +%s)
          trivy image --scanners vuln --severity CRITICAL,HIGH \
            --exit-code 1 --timeout 10m --no-progress \
            "$ACR_LOGIN_SERVER/vsf-be:$GIT_SHA"
          T1=$(date +%s)
          trivy image --scanners vuln --severity CRITICAL,HIGH \
            --exit-code 1 --timeout 10m --no-progress \
            "$ACR_LOGIN_SERVER/vsf-fe:$GIT_SHA"
          T2=$(date +%s)
          echo "trivy-be: $((T1-T0))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"
          echo "trivy-fe: $((T2-T1))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"

      - name: Push image lên ACR (đo thời gian)
        env:
          GIT_SHA: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ needs.preflight.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          T0=$(date +%s)
          docker push "$ACR_LOGIN_SERVER/vsf-be:$GIT_SHA"
          T1=$(date +%s)
          docker push "$ACR_LOGIN_SERVER/vsf-fe:$GIT_SHA"
          T2=$(date +%s)
          echo "push-be: $((T1-T0))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"
          echo "push-fe: $((T2-T1))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"

      # Cờ đời mới: --container-image-name / --container-registry-url. Không
      # truyền user/password — app pull bằng managed identity
      # (container_registry_use_managed_identity trong app.tf), việc set image
      # ở đây không được đụng vào cờ đó (kiểm lại ở bước ngay sau).
      - name: Đặt image cho slot staging (be + fe, đo thời gian)
        env:
          GIT_SHA: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ needs.preflight.outputs.acr_login_server }}
          BE_APP: ${{ needs.preflight.outputs.be_app }}
          FE_APP: ${{ needs.preflight.outputs.fe_app }}
        run: |
          set -euo pipefail
          T0=$(date +%s)
          az webapp config container set \
            -g rg-vsf-dev -n "$BE_APP" --slot staging \
            --container-image-name "$ACR_LOGIN_SERVER/vsf-be:$GIT_SHA" \
            --container-registry-url "https://$ACR_LOGIN_SERVER"
          T1=$(date +%s)
          az webapp config container set \
            -g rg-vsf-dev -n "$FE_APP" --slot staging \
            --container-image-name "$ACR_LOGIN_SERVER/vsf-fe:$GIT_SHA" \
            --container-registry-url "https://$ACR_LOGIN_SERVER"
          T2=$(date +%s)
          echo "set-image-be: $((T1-T0))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"
          echo "set-image-fe: $((T2-T1))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"

      # BẪY THẬT: `container set` báo thành công (exit code 0) ngay cả khi nó
      # âm thầm xoá acrUseManagedIdentityCreds — lúc đó app mất quyền pull
      # bằng managed identity và container không khởi động được, nhưng không
      # có dòng nào ở bước trên nói cho biết điều đó. Phải tự đọc lại và tự
      # quyết định đỏ/xanh, vì az không làm hộ.
      #
      # ĐỌC BẰNG `az webapp config show`, KHÔNG PHẢI `az webapp config container
      # show`: lệnh `container show` trả về một DANH SÁCH cặp {name, value} của
      # app setting DOCKER_* chứ không phải object SiteConfig, nên
      # `--query acrUseManagedIdentityCreds` trên nó LUÔN ra chuỗi rỗng — biến
      # đúng cái cổng an toàn này thành bước LUÔN ĐỎ dù cấu hình hoàn toàn đúng.
      # Bản đầu của file này (AI sinh) dính đúng lỗi đó, bắt được trước khi chạy
      # nhờ đọc `--help` chứ không phải nhờ test — ai-failure-log.md. Căn cứ
      # property nằm ở SiteConfig: `az webapp config set` có cờ
      # `--acr-use-identity`.
      - name: Kiểm lại acrUseManagedIdentityCreds sau khi đặt image (bẫy thật)
        env:
          BE_APP: ${{ needs.preflight.outputs.be_app }}
          FE_APP: ${{ needs.preflight.outputs.fe_app }}
        run: |
          set -euo pipefail
          for PAIR in "be:$BE_APP" "fe:$FE_APP"; do
            SERVICE="${PAIR%%:*}"
            APP="${PAIR#*:}"
            USE_MI=$(az webapp config show \
              -g rg-vsf-dev -n "$APP" --slot staging \
              --query "acrUseManagedIdentityCreds" -o tsv)
            # RỖNG và "false" là HAI nguyên nhân khác hẳn nhau, đừng gộp chung
            # một thông điệp: rỗng = truy vấn sai tên field hoặc API đổi shape
            # (lỗi của chính workflow này), false = cờ thật sự bị tắt (lỗi của
            # lệnh set ở bước trên). Gộp lại là phiên sau truy nhầm hướng.
            if [ -z "$USE_MI" ]; then
              echo "::error::$SERVICE ($APP/staging) doc ra RONG cho acrUseManagedIdentityCreds — day khong phai co bi tat ma la truy van sai. Kiem lai ten field va shape tra ve cua 'az webapp config show'. Buoc dat image o tren khong co loi."
              exit 1
            fi
            if [ "$USE_MI" != "true" ]; then
              echo "::error::$SERVICE ($APP/staging) mat co acrUseManagedIdentityCreds sau khi 'container set' (gia tri hien tai: $USE_MI) — app se khong pull duoc image bang managed identity, container se khong khoi dong duoc du lenh set truoc do bao thanh cong."
              exit 1
            fi
            echo "$SERVICE/staging: acrUseManagedIdentityCreds=$USE_MI (dung)"
          done

      # KHÔNG curl kiểm chứng ở đây: slot staging có ip_restriction_default_action
      # = "Deny" và runner GitHub Actions không nằm trong var.allowed_ips (IP nhà
      # đã khai riêng) → curl từ CI chắc chắn nhận 403, không phản ánh đúng trạng
      # thái container. Chờ thời gian cố định là tạm đủ cho D16; bước "chờ staging
      # sẵn sàng + đúng SHA" bằng cách mở tạm access restriction là việc của D17
      # (docs/guides/d16-cd.md bước 8) — ở đây chỉ chờ rồi giao thẳng cho swap.
      - name: Chờ container khởi động (thời gian cố định)
        run: |
          set -euo pipefail
          T0=$(date +%s)
          sleep 75
          T1=$(date +%s)
          echo "wait-staging-warmup: $((T1-T0))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"

      - name: Ghi job summary
        env:
          GIT_SHA: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ needs.preflight.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          {
            echo "### CD — build + push + set image slot staging"
            echo ""
            echo "- SHA: \`$GIT_SHA\`"
            echo "- Image be: \`$ACR_LOGIN_SERVER/vsf-be:$GIT_SHA\`"
            echo "- Image fe: \`$ACR_LOGIN_SERVER/vsf-fe:$GIT_SHA\`"
            echo ""
            echo "| Bước | Thời gian |"
            echo "|---|---|"
            while IFS=: read -r STEP SECS; do
              echo "|$STEP |$SECS |"
            done < "$GITHUB_WORKSPACE/.cd-timings.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # swap — environment `production`. HIỆN TẠI environment này CHỈ có deployment
  # branch policy = `main`, KHÔNG có required reviewer: GitHub từ chối tạo luật
  # đó cho repo private — "Please ensure the billing plan supports the required
  # reviewers protection rule" (HTTP 422, 23/09). Xem known-issues.md.
  #
  # Hệ quả: pipeline chạy TỰ ĐỘNG HOÀN TOÀN từ merge tới production, không một
  # thao tác tay nào — đúng tiêu chí "Xong khi" của docs/guides/d16-cd.md
  # (*merge → production đổi SHA không thao tác tay*).
  #
  # Nếu bật được nút duyệt sau này thì ĐÂY là chỗ đúng để đặt nó, không phải ở
  # job build: duyệt cái đã build + push + đặt vào staging xong, chứ không phải
  # duyệt một dự định còn mơ hồ. Bật lại chỉ tốn một lời gọi
  # `gh api -X PUT repos/<repo>/environments/production` kèm mảng `reviewers` —
  # KHÔNG phải sửa file này.
  # ==========================================================================
  swap:
    name: swap staging → production
    runs-on: ubuntu-24.04
    needs: [preflight, build-deploy-staging]
    # `url` để trang Deployments của GitHub trỏ thẳng tới mặt người dùng nhìn
    # thấy (fe) — ảnh chụp cho evidence/M10.md tự chứng minh hơn là một dòng
    # chữ "đã deploy".
    environment:
      name: production
      url: https://${{ needs.preflight.outputs.fe_app }}.azurewebsites.net
    steps:
      - name: Đăng nhập Azure OIDC (id-gh-deploy)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Swap slot staging → production (be + fe, đo thời gian)
        id: swap
        env:
          BE_APP: ${{ needs.preflight.outputs.be_app }}
          FE_APP: ${{ needs.preflight.outputs.fe_app }}
        run: |
          set -euo pipefail
          T0=$(date +%s)
          az webapp deployment slot swap \
            -g rg-vsf-dev -n "$BE_APP" --slot staging --target-slot production
          T1=$(date +%s)
          az webapp deployment slot swap \
            -g rg-vsf-dev -n "$FE_APP" --slot staging --target-slot production
          T2=$(date +%s)
          echo "swap-be: $((T1-T0))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"
          echo "swap-fe: $((T2-T1))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"

          BE_URL=$(az webapp show -g rg-vsf-dev -n "$BE_APP" --query defaultHostName -o tsv)
          FE_URL=$(az webapp show -g rg-vsf-dev -n "$FE_APP" --query defaultHostName -o tsv)
          echo "be_url=$BE_URL" >> "$GITHUB_OUTPUT"
          echo "fe_url=$FE_URL" >> "$GITHUB_OUTPUT"

      - name: Ghi job summary
        env:
          GIT_SHA: ${{ github.sha }}
          BE_URL: ${{ steps.swap.outputs.be_url }}
          FE_URL: ${{ steps.swap.outputs.fe_url }}
        run: |
          set -euo pipefail
          {
            echo "### CD — swap staging → production"
            echo ""
            echo "- SHA: \`$GIT_SHA\`"
            echo "- be: https://$BE_URL"
            echo "- fe: https://$FE_URL"
            echo ""
            echo "| Bước | Thời gian |"
            echo "|---|---|"
            while IFS=: read -r STEP SECS; do
              echo "|$STEP |$SECS |"
            done < "$GITHUB_WORKSPACE/.cd-timings.txt"
            echo ""
            # Swap là hoán đổi: ngay sau khi swap xong, slot staging đang giữ
            # ĐÚNG bản production cũ. Rollback nhanh nhất khi bản mới lỗi là
            # swap lại — vài chục giây, không build lại, không kéo image mới.
            # Điều kiện: đừng deploy chồng lần thứ hai trước khi rollback.
            echo "> Rollback nhanh nhất nếu bản mới lỗi: **swap lại** (slot staging đang giữ đúng bản production cũ)."
          } >> "$GITHUB_STEP_SUMMARY"
