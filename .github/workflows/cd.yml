name: CD

# Chỉ chạy theo push vào main (merge PR) — deploy KHÔNG chạy theo pull_request,
# đó là việc của ci.yml. workflow_dispatch chỉ để chạy tay khi cần điều tra;
# nó vẫn bị chặn bởi cả ba lớp bảo vệ mô tả ở job `preflight` bên dưới, nên
# không phải một cửa hậu.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # D17 quyết định C (notes/d17-prep.md): 3 tình huống lỗi của guide đều dừng
      # TRƯỚC swap (poll staging hết giờ), nên nhánh rollback tự động (job `swap`,
      # bước "Kiểm tra production" + "Rollback") CHƯA TỪNG chạy thật nếu không có
      # cách nào ép nó chạy. Input này CỐ Ý so kiểm production với một SHA SAI để
      # bước kiểm thất bại thật, kích rollback thật — chỉ dùng được qua
      # workflow_dispatch trên `main` (lớp bảo vệ thứ 3 ở job `preflight` vẫn chặn
      # nhánh khác, input này không mở thêm cửa nào). Trên sự kiện `push` (merge
      # PR bình thường), `inputs.*` rỗng nên biểu thức dùng nó (env
      # SIMULATE_VERIFY_FAILURE, job `swap`) LUÔN ra "false" — đã kiểm kỹ, xem
      # notes/d17.md.
      simulate_verify_failure:
        description: "D17: co y lam buoc kiem production that bai de thu rollback"
        type: boolean
        default: false

# Token cần đọc nội dung (checkout) và ghi id-token (OIDC vào Azure) — mọi job
# trong file này đều đăng nhập Azure nên khai ở cấp workflow, không lặp lại
# từng job như ci.yml (ci.yml chỉ có một job cần OIDC).
permissions:
  contents: read
  id-token: write

# MỘT nhóm deploy DUY NHẤT cho toàn bộ pipeline — khác ci-terraform-plan (nhóm
# theo ref) và khác ci chính (nhóm theo ref, huỷ được): ở đây hai lần merge
# liên tiếp vào main không được chạy CHỒNG lên nhau.
#
# Không phải "xếp hàng vô hạn": GitHub chỉ giữ MỘT run đang chạy + MỘT run
# CHỜ trong mỗi group. Merge dồn dập (3 lần merge liên tiếp) thì run đang chờ
# CŨ HƠN bị HUỶ (status cancelled) mỗi khi có run mới hơn vào hàng — hàng đợi
# tối đa dài 2, không phải "n lần merge thì n run nối đuôi nhau". Hệ quả: với
# merge dồn dập, commit ở giữa không được deploy RIÊNG, nhưng không mất — run
# mới nhất còn lại luôn build từ main mới nhất, tức đã chứa nó. Thấy một run
# CD ở trạng thái cancelled trong danh sách là bình thường, không phải lỗi.
#
# cancel-in-progress: false là CỐ Ý, ngược hẳn với ci.yml. Swap slot không phải
# thao tác nguyên tử theo góc nhìn người quan sát: nếu merge thứ hai huỷ ngang
# lúc merge thứ nhất đang poll/swap/kiểm production/rollback (D17: TẤT CẢ dồn
# vào một job `swap` duy nhất, xem comment ở job đó), production có thể dừng
# lại ở trạng thái không ai biết — kể cả để lại một luật access restriction
# tạm không được dọn (lỗ hổng M6). Chờ thì chậm hơn nhưng luôn kết thúc ở một
# trạng thái xác định được. Ở CI thì ngược lại: huỷ một lần build dở dang
# không để lại hậu quả nào, nên cancel-in-progress: true ở đó là đúng.
concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # preflight — CỐ Ý KHÔNG khai `environment:`. Đây là quyết định quan trọng
  # nhất của file này, vì hai lý do:
  #
  # (a) Environment protection (required reviewer, deployment branch policy)
  #     áp dụng ở CẤP JOB, không phải cấp workflow. Nếu để `preflight` nằm
  #     trong một environment thì MỌI push vào main — kể cả PR chỉ sửa tài
  #     liệu — đều sinh ra một job đang chờ, và nếu environment đó có required
  #     reviewer thì thành một yêu cầu duyệt TREO, dù rg-vsf-dev đang tắt
  #     (kỷ luật `make down`) và chẳng có gì để deploy cả. Tách preflight ra
  #     ngoài environment thì các PR loại đó đi qua êm: job chạy, tự nhận ra
  #     môi trường trống, kết thúc XANH, không ai phải bấm gì.
  #
  # (b) Job KHÔNG có `environment` thì subject của token OIDC mà GitHub phát
  #     hành là `repo:<org>/<repo>:ref:refs/heads/main` (xem
  #     infra/bootstrap/cicd.tf, azurerm_federated_identity_credential.gh_deploy_main,
  #     subject = "repo:${var.github_repo}:ref:refs/heads/main"). Đây chính là
  #     LỚP BẢO VỆ THỨ BA của "chỉ main được deploy" — chạy tay
  #     (workflow_dispatch) từ một nhánh feat/... thì subject sinh ra là
  #     `repo:<org>/<repo>:ref:refs/heads/feat/...`, không khớp federated
  #     credential nào đã khai trong Terraform, Entra từ chối phát token, và
  #     `azure/login` ở bước dưới FAIL — cả pipeline dừng ngay tại đây.
  #
  #     Ngược lại, nếu job này có `environment: xxx`, subject đổi hẳn dạng
  #     thành `repo:<org>/<repo>:environment:xxx` — KHÔNG còn mã hoá tên nhánh
  #     trong subject nữa. Lúc đó việc chặn nhánh sai hoàn toàn dồn vào lớp 2
  #     (deployment branch policy của environment, cấu hình được ở GitHub, có
  #     thể sửa nhầm) mà mất luôn lớp 3 (federated credential, nằm ngoài
  #     GitHub, Entra là bên phán quyết cuối). Giữ preflight ngoài environment
  #     là giữ cho lớp 3 còn tác dụng thật, không chỉ trên giấy.
  # ==========================================================================
  preflight:
    name: preflight (soi moi truong, khong doi hoi duyet)
    runs-on: ubuntu-24.04
    outputs:
      should_deploy: ${{ steps.probe.outputs.should_deploy }}
      be_app: ${{ steps.probe.outputs.be_app }}
      fe_app: ${{ steps.probe.outputs.fe_app }}
      acr_name: ${{ steps.probe.outputs.acr_name }}
      acr_login_server: ${{ steps.probe.outputs.acr_login_server }}
    steps:
      # Không checkout: job này chỉ hỏi Azure, không đụng tới nội dung repo.
      - name: Đăng nhập Azure OIDC (id-gh-deploy)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # rg-vsf-dev THƯỜNG không tồn tại (kỷ luật make down cuối buổi, D8) — az
      # trả lỗi khi RG hoặc resource không có, phải tự bắt lỗi đó để job vẫn
      # XANH thay vì đỏ oan mỗi khi có PR tài liệu merge vào lúc môi trường tắt.
      # Vì vậy KHÔNG set -e ở đây: mỗi lệnh az tự chịu lỗi bằng `|| true`.
      - name: Soi môi trường, tra tên thật của be/fe/ACR
        id: probe
        run: |
          set -uo pipefail

          BE_APP=$(az webapp list -g rg-vsf-dev \
            --query "[?starts_with(name,'app-vsf-')].name" -o tsv 2>/dev/null | head -n1 || true)
          FE_APP=$(az webapp list -g rg-vsf-dev \
            --query "[?starts_with(name,'fe-vsf-')].name" -o tsv 2>/dev/null | head -n1 || true)
          ACR_NAME=$(az acr list -g rg-vsf-dev \
            --query "[?starts_with(name,'acrvsf')].name" -o tsv 2>/dev/null | head -n1 || true)

          ACR_LOGIN_SERVER=""
          if [ -n "$ACR_NAME" ]; then
            ACR_LOGIN_SERVER=$(az acr show -n "$ACR_NAME" -g rg-vsf-dev \
              --query loginServer -o tsv 2>/dev/null || true)
          fi

          echo "be_app=$BE_APP" >> "$GITHUB_OUTPUT"
          echo "fe_app=$FE_APP" >> "$GITHUB_OUTPUT"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

          # Ba mức: (1) trống hoàn toàn — môi trường đã make down, bình
          # thường; (2) thiếu MỘT trong hai app hoặc thiếu ACR — nửa môi
          # trường, nguy hiểm hơn môi trường trống vì trông như có thể deploy
          # được; (3) đủ cả ba — mới cho should_deploy=true. Viết bằng
          # if/elif/else tường minh, KHÔNG dùng `[ ... ] && VAR=...` làm luồng
          # điều khiển: dạng đó chạy đúng hôm nay chỉ vì thiếu `set -e`, ai
          # thêm `set -e` sau (hoặc dời dòng đó xuống cuối script) là lặng lẽ
          # biến nó thành một lệnh có thể fail.
          if [ -z "$BE_APP" ] && [ -z "$FE_APP" ]; then
            SHOULD_DEPLOY=false
            REASON="rg-vsf-dev dang trong (da make down, hoac chua make up) — khong co be lan fe de deploy. Chay 'make up' roi re-run workflow nay neu muon deploy commit nay."
          elif [ -z "$BE_APP" ] || [ -z "$FE_APP" ]; then
            SHOULD_DEPLOY=false
            if [ -z "$FE_APP" ]; then
              MISSING="fe (prefix fe-vsf-)"
            else
              MISSING="be (prefix app-vsf-)"
            fi
            REASON="moi truong rg-vsf-dev khong day du — thieu Web App $MISSING. Nua moi truong con nguy hiem hon moi truong trong nen bo qua deploy. Chay 'make up' de dam bao ca hai app roi re-run workflow nay."
          elif [ -z "$ACR_NAME" ]; then
            SHOULD_DEPLOY=false
            REASON="rg-vsf-dev co ca be va fe nhung khong tim thay ACR (prefix acrvsf) — moi truong khong day du, bo qua deploy. Chay 'make up' roi re-run workflow nay."
          else
            SHOULD_DEPLOY=true
            REASON=""
          fi

          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_DEPLOY" = "false" ]; then
            echo "::notice::$REASON"
          fi

          # Ghi lại vào job summary — đây là thứ được chụp làm bằng chứng cho
          # evidence/M10.md ("CD không chạy vào hư không"). `::notice::` trôi
          # mất trong log thô, không phải chỗ đáng tin để tra lại sau này.
          {
            echo "### CD — preflight"
            echo ""
            echo "| App | Tìm được |"
            echo "|---|---|"
            echo "| be (prefix app-vsf-) | \`${BE_APP:-(không có)}\` |"
            echo "| fe (prefix fe-vsf-) | \`${FE_APP:-(không có)}\` |"
            echo "| ACR (prefix acrvsf) | \`${ACR_NAME:-(không có)}\` |"
            echo ""
            echo "- should_deploy: \`$SHOULD_DEPLOY\`"
            if [ "$SHOULD_DEPLOY" = "false" ]; then
              echo "- Lý do bỏ qua: $REASON"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # D17 (tuỳ chọn, notes/d17-prep.md điều 4): CHỈ CẢNH BÁO, KHÔNG gỡ. Lưới
      # cho trường hợp job `swap` của một lần chạy trước bị HUỶ GIỮA CHỪNG theo
      # kiểu runner chết (không phải job bị cancel bình thường — `if: always()`
      # ở bước dọn của `swap` vẫn chạy khi job bị cancel, chỉ KHÔNG chạy khi
      # runner mất hẳn). `terraform plan` (C6 trong notes/d17-prep.md) là lưới
      # chính; bước này chỉ là lớp cảnh báo sớm, chạy mỗi lần preflight nên
      # không cần chờ tới lúc ai đó nhớ chạy plan tay.
      - name: Quét luật cd-* mồ côi còn sót trên 4 bề mặt (chỉ cảnh báo, không gỡ)
        if: steps.probe.outputs.should_deploy == 'true'
        env:
          BE_APP: ${{ steps.probe.outputs.be_app }}
          FE_APP: ${{ steps.probe.outputs.fe_app }}
        run: |
          set -uo pipefail
          for SURFACE in be be-staging fe fe-staging; do
            case "$SURFACE" in
              be) APP="$BE_APP"; SLOT_ARGS=() ;;
              be-staging) APP="$BE_APP"; SLOT_ARGS=(--slot staging) ;;
              fe) APP="$FE_APP"; SLOT_ARGS=() ;;
              fe-staging) APP="$FE_APP"; SLOT_ARGS=(--slot staging) ;;
            esac
            ORPHANS=$(az webapp config access-restriction show \
              -g rg-vsf-dev -n "$APP" "${SLOT_ARGS[@]}" \
              --query "ipSecurityRestrictions[?starts_with(name,'cd-')].name" -o tsv 2>/dev/null || true)
            if [ -n "$ORPHANS" ]; then
              echo "::warning::luat cd-* mo coi tren $SURFACE ($APP): $ORPHANS — co the mot lan chay truoc bi runner chet giua chung (buoc don o job swap khong kip chay). Kiem tay, go bang 'az webapp config access-restriction remove'."
            fi
          done

  # ==========================================================================
  # build-deploy-staging — environment staging-deploy (không required reviewer,
  # chỉ giới hạn nhánh main). Chạy hoàn toàn tự động, không ai chạm vào.
  # ==========================================================================
  build-deploy-staging:
    name: build + push ACR + set image slot staging
    runs-on: ubuntu-24.04
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true'
    environment: staging-deploy
    steps:
      - uses: actions/checkout@v7

      - name: Đăng nhập Azure OIDC (id-gh-deploy)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Đăng nhập ACR bằng danh tính Entra vừa login ở trên — KHÔNG dùng
      # admin user/password (ACR khai admin_enabled = false ở acr.tf, đúng M1).
      - name: Đăng nhập ACR bằng danh tính Entra
        env:
          ACR_NAME: ${{ needs.preflight.outputs.acr_name }}
        run: az acr login -n "$ACR_NAME"

      # Build cả hai image. CẢ HAI đều nhận --build-arg GIT_SHA: be nhúng vào
      # binary lúc dịch (OpsBoard.csproj, target EmbedGitSha) còn fe nhúng thành
      # ENV ở stage runtime cho route /api/version đọc lúc chạy. Thiếu cờ này ở
      # một trong hai thì service đó trả sha "dev" trên production, và triệu
      # chứng trông hệt như CD không deploy được.
      - name: Build image be + fe (đo thời gian)
        env:
          GIT_SHA: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ needs.preflight.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          T0=$(date +%s)
          docker build --build-arg GIT_SHA="$GIT_SHA" \
            -t "$ACR_LOGIN_SERVER/vsf-be:$GIT_SHA" app/be/
          T1=$(date +%s)
          docker build --build-arg GIT_SHA="$GIT_SHA" \
            -t "$ACR_LOGIN_SERVER/vsf-fe:$GIT_SHA" app/fe/
          T2=$(date +%s)
          echo "build-be: $((T1-T0))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"
          echo "build-fe: $((T2-T1))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"

      # Cache database CVE theo run_id — cùng lý do và cùng key scheme với
      # ci.yml: không tải lại ~700MB mỗi lần, nhưng không giữ quá lâu (dữ
      # liệu CVE đổi liên tục).
      - name: Cache database Trivy
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      # Chạy thẳng binary ghim version, giống hệt ci.yml: giữ token của job
      # này (id-gh-deploy, đã có quyền ghi vào Azure) khỏi phải cấp thêm
      # quyền comment/upload cho một action bên thứ ba, và giữ kết quả quét
      # tái lập được giữa các lần chạy.
      - name: Cài trivy ${{ env.TRIVY_VERSION }}
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          curl -sSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version

      # CỔNG, đúng chính sách CI (Q4, D14): CRITICAL,HIGH, KHÔNG --ignore-unfixed,
      # KHÔNG continue-on-error. Đây là image SẮP lên production, không phải
      # image thử nghiệm — quét lại ở đây không phải trang trí lặp lại việc
      # ci.yml đã làm, mà là chốt lần cuối trên đúng cái sắp push, vì layer
      # base image có thể đã có CVE mới xuất hiện giữa lúc PR được review và
      # lúc merge thật sự chạy build này.
      - name: Trivy — cổng CRITICAL/HIGH cho be + fe (đo thời gian)
        env:
          GIT_SHA: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ needs.preflight.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          T0=$(date +%s)
          trivy image --scanners vuln --severity CRITICAL,HIGH \
            --exit-code 1 --timeout 10m --no-progress \
            "$ACR_LOGIN_SERVER/vsf-be:$GIT_SHA"
          T1=$(date +%s)
          trivy image --scanners vuln --severity CRITICAL,HIGH \
            --exit-code 1 --timeout 10m --no-progress \
            "$ACR_LOGIN_SERVER/vsf-fe:$GIT_SHA"
          T2=$(date +%s)
          echo "trivy-be: $((T1-T0))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"
          echo "trivy-fe: $((T2-T1))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"

      # SBOM (người dùng duyệt 01/10): danh sách mọi gói trong ĐÚNG image sắp push,
      # dạng CycloneDX. Dùng lại trivy đã cài + database đã tải ở bước trên, không
      # thêm công cụ. Giá trị: khi có CVE mới (như CVE-2026-84782 làm đỏ CD sáng
      # 01/10), tra "image nào đang chạy có gói X" từ artifact mà không cần build lại.
      - name: SBOM CycloneDX cho be + fe
        env:
          GIT_SHA: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ needs.preflight.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sbom"
          for svc in be fe; do
            trivy image --format cyclonedx --timeout 10m --no-progress \
              --output "$RUNNER_TEMP/sbom/sbom-$svc-$GIT_SHA.cdx.json" \
              "$ACR_LOGIN_SERVER/vsf-$svc:$GIT_SHA"
            echo "sbom $svc: $(jq '.components | length' "$RUNNER_TEMP/sbom/sbom-$svc-$GIT_SHA.cdx.json") components"
          done

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sbom/
          retention-days: 90

      - name: Push image lên ACR (đo thời gian)
        env:
          GIT_SHA: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ needs.preflight.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          T0=$(date +%s)
          docker push "$ACR_LOGIN_SERVER/vsf-be:$GIT_SHA"
          T1=$(date +%s)
          docker push "$ACR_LOGIN_SERVER/vsf-fe:$GIT_SHA"
          T2=$(date +%s)
          echo "push-be: $((T1-T0))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"
          echo "push-fe: $((T2-T1))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"

      # Cờ đời mới: --container-image-name / --container-registry-url. Không
      # truyền user/password — app pull bằng managed identity
      # (container_registry_use_managed_identity trong app.tf), việc set image
      # ở đây không được đụng vào cờ đó (kiểm lại ở bước ngay sau).
      - name: Đặt image cho slot staging (be + fe, đo thời gian)
        env:
          GIT_SHA: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ needs.preflight.outputs.acr_login_server }}
          BE_APP: ${{ needs.preflight.outputs.be_app }}
          FE_APP: ${{ needs.preflight.outputs.fe_app }}
        run: |
          set -euo pipefail
          T0=$(date +%s)
          az webapp config container set \
            -g rg-vsf-dev -n "$BE_APP" --slot staging \
            --container-image-name "$ACR_LOGIN_SERVER/vsf-be:$GIT_SHA" \
            --container-registry-url "https://$ACR_LOGIN_SERVER"
          T1=$(date +%s)
          az webapp config container set \
            -g rg-vsf-dev -n "$FE_APP" --slot staging \
            --container-image-name "$ACR_LOGIN_SERVER/vsf-fe:$GIT_SHA" \
            --container-registry-url "https://$ACR_LOGIN_SERVER"
          T2=$(date +%s)
          echo "set-image-be: $((T1-T0))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"
          echo "set-image-fe: $((T2-T1))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"

      # BẪY THẬT: `container set` báo thành công (exit code 0) ngay cả khi nó
      # âm thầm xoá acrUseManagedIdentityCreds — lúc đó app mất quyền pull
      # bằng managed identity và container không khởi động được, nhưng không
      # có dòng nào ở bước trên nói cho biết điều đó. Phải tự đọc lại và tự
      # quyết định đỏ/xanh, vì az không làm hộ.
      #
      # ĐỌC BẰNG `az webapp config show`, KHÔNG PHẢI `az webapp config container
      # show`: lệnh `container show` trả về một DANH SÁCH cặp {name, value} của
      # app setting DOCKER_* chứ không phải object SiteConfig, nên
      # `--query acrUseManagedIdentityCreds` trên nó LUÔN ra chuỗi rỗng — biến
      # đúng cái cổng an toàn này thành bước LUÔN ĐỎ dù cấu hình hoàn toàn đúng.
      # Bản đầu của file này (AI sinh) dính đúng lỗi đó, bắt được trước khi chạy
      # nhờ đọc `--help` chứ không phải nhờ test — ai-failure-log.md. Căn cứ
      # property nằm ở SiteConfig: `az webapp config set` có cờ
      # `--acr-use-identity`.
      - name: Kiểm lại acrUseManagedIdentityCreds sau khi đặt image (bẫy thật)
        env:
          BE_APP: ${{ needs.preflight.outputs.be_app }}
          FE_APP: ${{ needs.preflight.outputs.fe_app }}
        run: |
          set -euo pipefail
          for PAIR in "be:$BE_APP" "fe:$FE_APP"; do
            SERVICE="${PAIR%%:*}"
            APP="${PAIR#*:}"
            USE_MI=$(az webapp config show \
              -g rg-vsf-dev -n "$APP" --slot staging \
              --query "acrUseManagedIdentityCreds" -o tsv)
            # RỖNG và "false" là HAI nguyên nhân khác hẳn nhau, đừng gộp chung
            # một thông điệp: rỗng = truy vấn sai tên field hoặc API đổi shape
            # (lỗi của chính workflow này), false = cờ thật sự bị tắt (lỗi của
            # lệnh set ở bước trên). Gộp lại là phiên sau truy nhầm hướng.
            if [ -z "$USE_MI" ]; then
              echo "::error::$SERVICE ($APP/staging) doc ra RONG cho acrUseManagedIdentityCreds — day khong phai co bi tat ma la truy van sai. Kiem lai ten field va shape tra ve cua 'az webapp config show'. Buoc dat image o tren khong co loi."
              exit 1
            fi
            if [ "$USE_MI" != "true" ]; then
              echo "::error::$SERVICE ($APP/staging) mat co acrUseManagedIdentityCreds sau khi 'container set' (gia tri hien tai: $USE_MI) — app se khong pull duoc image bang managed identity, container se khong khoi dong duoc du lenh set truoc do bao thanh cong."
              exit 1
            fi
            echo "$SERVICE/staging: acrUseManagedIdentityCreds=$USE_MI (dung)"
          done

      # KHÔNG curl kiểm chứng ở đây: slot staging có ip_restriction_default_action
      # = "Deny" và runner GitHub Actions không nằm trong var.allowed_ips (IP nhà
      # đã khai riêng) → curl từ CI chắc chắn nhận 403, không phản ánh đúng trạng
      # thái container. D16 chờ thời gian cố định (sleep 75) ở đây là tạm đủ; từ
      # D17 việc "chờ staging sẵn sàng + đúng SHA" chuyển hẳn sang job `swap` bằng
      # cách mở tạm access restriction rồi poll (docs/guides/d17-safe-swap.md bước
      # 8) — job này giờ chỉ build + push + đặt image rồi giao thẳng cho `swap`,
      # không còn chờ gì ở đây nữa (P3, notes/d17-prep.md: luật tạm thêm ở job này
      # thì kiểm ở job khác sẽ 403 vì IP RUNNER KHÁC NHAU GIỮA CÁC JOB).
      - name: Ghi job summary
        env:
          GIT_SHA: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ needs.preflight.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          {
            echo "### CD — build + push + set image slot staging"
            echo ""
            echo "- SHA: \`$GIT_SHA\`"
            echo "- Image be: \`$ACR_LOGIN_SERVER/vsf-be:$GIT_SHA\`"
            echo "- Image fe: \`$ACR_LOGIN_SERVER/vsf-fe:$GIT_SHA\`"
            echo ""
            echo "| Bước | Thời gian |"
            echo "|---|---|"
            while IFS=: read -r STEP SECS; do
              echo "|$STEP |$SECS |"
            done < "$GITHUB_WORKSPACE/.cd-timings.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # swap — environment `production`. HIỆN TẠI environment này CHỈ có deployment
  # branch policy = `main`, KHÔNG có required reviewer: GitHub từ chối tạo luật
  # đó cho repo private — "Please ensure the billing plan supports the required
  # reviewers protection rule" (HTTP 422, 23/09). Xem known-issues.md #14.
  #
  # D17: MỘT job DUY NHẤT làm hết — thêm luật tạm, poll staging, swap, kiểm
  # production, rollback nếu cần, dọn luật, ghi summary. Lý do dồn hết vào một
  # job (P3, notes/d17-prep.md điều 1): mỗi job GitHub Actions chạy trên MỘT
  # RUNNER RIÊNG, IP công khai khác nhau giữa các job. Thêm luật allow IP ở
  # job A rồi gọi (poll/kiểm) từ job B sẽ 403 vì đó là IP khác. Thứ tự bước
  # thật trong job này (không nhất thiết đúng số thứ tự trong guide/prep):
  #   1. Đăng nhập Azure OIDC
  #   2. Lấy + kiểm dạng IPv4 của runner
  #   3. Thêm luật access restriction tạm (4 bề mặt: be, be-staging, fe, fe-staging)
  #   4. Poll staging tới khi be-staging /version=SHA + /health 200 VÀ
  #      fe-staging /api/version=SHA + /api/health 200 (bằng chứng #15 — fe
  #      staging THẬT SỰ gọi được be staging, không chỉ SHA khớp — xem #18).
  #      Hết giờ (~300s) → KHÔNG swap, job đỏ.
  #   5. Swap be rồi fe (giữ nguyên logic + cờ be_swapped/fe_swapped cũ).
  #   6. Kiểm production N=5 lần cách nhau 5s (be /version+/health, fe
  #      /api/version+/api/health) — quyết định C: input simulate_verify_failure
  #      cố ý so với SHA sai để nhánh rollback chạy thật được ít nhất một lần.
  #   7. Lỗi ở bước 5 (fe swap hỏng sau khi be đã swap) HOẶC bước 6 → rollback:
  #      swap ngược app ĐÃ swap, thứ tự fe trước rồi be (P6: không bao giờ
  #      swap ngược app CHƯA swap).
  #   8. Dọn luật tạm — if: always(), LUÔN chạy dù mọi bước trên đỏ/bị huỷ, tự
  #      chịu lỗi từng lệnh remove rồi ĐỌC LẠI bằng access-restriction show và
  #      FAIL nếu còn sót — báo "thành công" không phải bằng chứng, đọc lại mới
  #      là bằng chứng (điều 4, notes/d17-prep.md).
  #   9. Ghi summary — if: always().
  #
  # P7 (notes/d17-prep.md "Bảng bẫy"): ĐỪNG re-run một mình job `swap` sau khi
  # nó đã swap xong — swap lần 2 nghĩa là đưa bản CŨ trở lại production. Muốn
  # thử lại, re-run cả WORKFLOW từ đầu (build lại, set image mới vào staging
  # rồi mới swap), không re-run job lẻ.
  #
  # Nếu bật được nút duyệt tay sau này thì ĐÂY là chỗ đúng để đặt nó (trước
  # bước swap), không phải ở job build.
  # ==========================================================================
  swap:
    name: swap staging → production
    runs-on: ubuntu-24.04
    needs: [preflight, build-deploy-staging]
    # `url` để trang Deployments của GitHub trỏ thẳng tới mặt người dùng nhìn
    # thấy (fe) — ảnh chụp cho evidence/M10.md tự chứng minh hơn là một dòng
    # chữ "đã deploy".
    environment:
      name: production
      url: https://${{ needs.preflight.outputs.fe_app }}.azurewebsites.net
    # Job-level env: mọi step bên dưới đọc được thẳng bằng $BE_APP, $FE_APP...
    # (biến môi trường OS), không cần khai lại `env:` trong từng step trừ khi
    # cần thứ chỉ step đó có (vd RUNNER_IP — output của step "IP công khai").
    env:
      BE_APP: ${{ needs.preflight.outputs.be_app }}
      FE_APP: ${{ needs.preflight.outputs.fe_app }}
      GIT_SHA: ${{ github.sha }}
      # run_attempt (không chỉ run_id) vào tên luật: re-run cùng workflow run
      # (không re-run job lẻ, xem P7) vẫn ra tên MỚI, không đụng luật cũ nếu
      # lần trước dọn chưa kịp.
      RULE_NAME: cd-${{ github.run_id }}-${{ github.run_attempt }}
      # Quyết định C: rỗng ở sự kiện `push` (merge PR bình thường) vì `inputs.*`
      # không tồn tại ngoài workflow_dispatch — biểu thức dưới đây cho ra
      # "false" trong mọi trường hợp KHÔNG PHẢI cố ý bật bằng tay qua
      # workflow_dispatch trên main.
      SIMULATE_VERIFY_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_verify_failure && 'true' || 'false' }}
    steps:
      - name: Đăng nhập Azure OIDC (id-gh-deploy)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: IP công khai của runner (kiểm đúng dạng IPv4 trước khi dùng)
        id: runner-ip
        run: |
          set -uo pipefail
          IP=$(curl -4 -s --max-time 15 https://api.ipify.org || true)

          # Rỗng hoặc sai dạng (IPv6, trang lỗi HTML của ipify...) thì KHÔNG
          # được đi tiếp thêm luật "/32" — fail sớm ở đây rẻ hơn nhiều so với
          # phát hiện muộn lúc `az access-restriction add` báo lỗi cú pháp CIDR
          # (hoặc tệ hơn, âm thầm khai một dải sai).
          VALID=1
          if ! [[ "$IP" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            VALID=0
          else
            IFS='.' read -r O1 O2 O3 O4 <<< "$IP"
            for O in "$O1" "$O2" "$O3" "$O4"; do
              if [ "$O" -gt 255 ]; then VALID=0; fi
            done
          fi

          if [ "$VALID" -ne 1 ]; then
            echo "::error::IP runner khong hop le hoac rong: '$IP' — dung lai, khong them luat access restriction voi gia tri nay."
            exit 1
          fi

          echo "runner IP: $IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      # P3 (notes/d17-prep.md): 4 bề mặt = be + be-staging + fe + fe-staging.
      # THÊM CẢ production (be, fe) từ bước này, không chỉ staging — bước kiểm
      # production (sau swap) chạy TRONG CÙNG job này nên cần quyền vào production
      # từ ngay bây giờ, không phải đợi swap xong mới mở thêm.
      - name: Thêm luật access restriction tạm cho IP runner (4 bề mặt)
        id: add-rules
        env:
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -uo pipefail
          # priority < 100: IP nhà (Terraform, infra/app/app.tf local.ip_rules)
          # chiếm dải 100+ — luật tạm này không được đụng vào đó.
          # description: ASCII thuần, không dấu `,`/`;`, dưới 64 byte
          # (ai-failure-log.md #23, #30) — chuỗi dưới đây 47 byte, đo bằng
          # `len(s.encode())` lúc soạn, không đếm bằng mắt.
          PRIORITY=50
          DESC="D17 CD tam - runner IP - tu go sau job (cd.yml)"

          FAIL=0
          for SURFACE in be be-staging fe fe-staging; do
            case "$SURFACE" in
              be) APP="$BE_APP"; SLOT_ARGS=() ;;
              be-staging) APP="$BE_APP"; SLOT_ARGS=(--slot staging) ;;
              fe) APP="$FE_APP"; SLOT_ARGS=() ;;
              fe-staging) APP="$FE_APP"; SLOT_ARGS=(--slot staging) ;;
            esac
            if ! az webapp config access-restriction add \
                 -g rg-vsf-dev -n "$APP" "${SLOT_ARGS[@]}" \
                 --rule-name "$RULE_NAME" --action Allow \
                 --ip-address "$RUNNER_IP/32" --priority "$PRIORITY" \
                 --description "$DESC"; then
              echo "::error::khong them duoc luat tam vao $SURFACE ($APP) — xem log az o tren."
              FAIL=1
            fi
          done
          exit "$FAIL"

      # Thay hẳn bước "sleep 75" cũ (build-deploy-staging, D16) bằng chờ ĐÚNG
      # điều kiện. KHÔNG set -e: một lần curl/jq lỗi (403 vài giây đầu sau khi
      # thêm luật, mất gói tin...) chỉ là "chưa", không được giết cả vòng poll
      # (P4, notes/d17-prep.md). set -o pipefail giữ để `curl | jq` báo đúng mã
      # lỗi khi CẦN — nhưng mọi lệnh trong vòng lặp đều có `|| true`/`|| echo`
      # riêng nên pipefail không làm vòng lặp chết giữa chừng.
      - name: Poll staging tới khi đúng SHA + health 200 (be VÀ fe, #15)
        id: poll
        run: |
          set -uo pipefail

          BE_STAGING="https://$BE_APP-staging.azurewebsites.net"
          FE_STAGING="https://$FE_APP-staging.azurewebsites.net"

          T0=$(date +%s)
          DEADLINE=$((T0 + 300))
          OK=0

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            BE_VER_BODY=$(curl -4 -s --max-time 10 "$BE_STAGING/version" || true)
            BE_HEALTH_CODE=$(curl -4 -s -o /dev/null -w '%{http_code}' --max-time 10 "$BE_STAGING/health" || true)
            FE_VER_BODY=$(curl -4 -s --max-time 10 "$FE_STAGING/api/version" || true)
            FE_HEALTH_RESP=$(curl -4 -s -w $'\n%{http_code}' --max-time 10 "$FE_STAGING/api/health" || true)
            FE_HEALTH_CODE=$(printf '%s' "$FE_HEALTH_RESP" | tail -n1)
            FE_HEALTH_BODY=$(printf '%s' "$FE_HEALTH_RESP" | sed '$d')

            BE_SHA=$(printf '%s' "$BE_VER_BODY" | jq -r '.sha // empty' 2>/dev/null || true)
            FE_SHA=$(printf '%s' "$FE_VER_BODY" | jq -r '.sha // empty' 2>/dev/null || true)
            # be_host: bằng chứng fe-staging THẬT SỰ gọi be-staging (#15), không
            # chỉ trùng ngẫu nhiên SHA — in mỗi vòng để có trong log dù thành
            # công hay hết giờ.
            FE_BE_HOST=$(printf '%s' "$FE_HEALTH_BODY" | jq -r '.be_host // empty' 2>/dev/null || true)

            echo "$(date -Is) poll be.sha=$BE_SHA be.health=$BE_HEALTH_CODE fe.sha=$FE_SHA fe.health=$FE_HEALTH_CODE fe.health.be_host=$FE_BE_HOST"

            if [ "$BE_SHA" = "$GIT_SHA" ] && [ "$BE_HEALTH_CODE" = "200" ] \
               && [ "$FE_SHA" = "$GIT_SHA" ] && [ "$FE_HEALTH_CODE" = "200" ]; then
              OK=1
              break
            fi
            sleep 5
          done

          T1=$(date +%s)
          WAITED=$((T1 - T0))
          echo "waited_seconds=$WAITED" >> "$GITHUB_OUTPUT"
          echo "wait-staging-poll: ${WAITED}s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"

          if [ "$OK" -ne 1 ]; then
            echo "::error::het gio poll staging (300s, cho $WAITED s) — SHA hoac health chua dat dieu kien. KHONG swap."
            echo "--- lan goi cuoi cung cua tung URL (ma + body rut gon) ---"
            printf 'be /version: '; curl -4 -s --max-time 10 "$BE_STAGING/version" | head -c 300; echo
            printf 'be /health: code='; curl -4 -s -o /dev/null -w '%{http_code}\n' --max-time 10 "$BE_STAGING/health"
            printf 'fe /api/version: '; curl -4 -s --max-time 10 "$FE_STAGING/api/version" | head -c 300; echo
            printf 'fe /api/health: '; curl -4 -s --max-time 10 "$FE_STAGING/api/health" | head -c 300; echo
            exit 1
          fi

          echo "poll_ok=true" >> "$GITHUB_OUTPUT"
          echo "staging san sang sau ${WAITED}s (SHA=$GIT_SHA, be+fe health 200)"

      # Drill 2 (D24, docs/drills/2026-10-01-bad-deploy.md): PR làm `GET /items` 503
      # qua được CI 8/8 VÀ cổng poll ở trên (chỉ nhìn /health, /version, /api/health),
      # production lỗi 12 phút. /health đúng nghĩa là readiness, không phải kiểm hành
      # vi nghiệp vụ — nên cần thêm một lớp smoke gọi đúng các route người dùng chạm
      # tới, trên STAGING, trước swap. Chỉ GET (không ghi dữ liệu vào DB production
      # dùng chung giữa 2 slot). Đỏ ở đây = KHÔNG swap; luật IP tạm vẫn được dọn ở
      # bước `if: always()` phía dưới.
      - name: Smoke test nghiệp vụ trên staging (GET /items, trang fe) — đỏ thì KHÔNG swap
        id: smoke
        run: |
          set -uo pipefail
          BE_STAGING="https://$BE_APP-staging.azurewebsites.net"
          FE_STAGING="https://$FE_APP-staging.azurewebsites.net"
          fail=0
          # tên|URL|mã mong đợi|jq kiểm body (rỗng = chỉ kiểm mã)
          checks=(
            "be GET /items|$BE_STAGING/items|200|.items | type == \"array\""
            "be GET /items?limit=1|$BE_STAGING/items?limit=1|200|.items | type == \"array\""
            "be GET /stats|$BE_STAGING/stats|200|"
            "fe GET /|$FE_STAGING/|200|"
          )
          {
            echo "### Smoke test staging ($GIT_SHA)"
            echo
            echo "| kiểm | mã | kết quả |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for c in "${checks[@]}"; do
            IFS='|' read -r name url want jqexpr <<<"$c"
            # 3 lần, cách 5s: container vừa lên có thể trả lỗi thoáng qua (#20).
            for attempt in 1 2 3; do
              resp=$(curl -4 -s -w $'\n%{http_code}' --max-time 15 "$url" || true)
              code=$(printf '%s' "$resp" | tail -n1)
              body=$(printf '%s' "$resp" | sed '$d')
              ok=0
              if [ "$code" = "$want" ]; then
                if [ -z "$jqexpr" ] || printf '%s' "$body" | jq -e "$jqexpr" >/dev/null 2>&1; then ok=1; fi
              fi
              [ "$ok" -eq 1 ] && break
              sleep 5
            done
            if [ "$ok" -eq 1 ]; then
              verdict="đạt"
            else
              verdict="LỖI"
              fail=1
              echo "::error::smoke '$name' -> $code (mong $want): $(printf '%s' "$body" | head -c 200)"
            fi
            echo "$(date -Is) smoke $name -> $code ($verdict)"
            echo "| $name | $code | $verdict |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::smoke test staging THAT BAI — KHONG swap, production giu ban cu."
            exit 1
          fi

      # DAST nhẹ (người dùng duyệt 01/10): OWASP ZAP baseline = spider 1 phút + quét
      # THỤ ĐỘNG (không tấn công, không gửi payload) trên staging, đúng lúc runner đã
      # có luật IP tạm. CHỈ CẢNH BÁO: báo cáo vào artifact + summary, không chặn swap —
      # baseline chủ yếu ra header thiếu (CSP, HSTS...), chưa có ngưỡng nào đã được
      # thống nhất để chặn deploy. Lỗi của chính ZAP (pull image, mạng) cũng không chặn.
      - name: DAST — ZAP baseline thụ động trên staging (chỉ cảnh báo)
        env:
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.16.1
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/zap" && chmod 777 "$RUNNER_TEMP/zap"
          {
            echo "### DAST — ZAP baseline (thụ động, chỉ cảnh báo)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for target in "be|https://$BE_APP-staging.azurewebsites.net/items" "fe|https://$FE_APP-staging.azurewebsites.net/"; do
            IFS='|' read -r name url <<<"$target"
            # -I: không trả mã lỗi vì WARN; -m 1: spider 1 phút. Mã 1 = có FAIL, 2 = WARN, 3 = lỗi ZAP.
            docker run --rm -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
              zap-baseline.py -t "$url" -m 1 -I -r "zap-$name.html" -J "zap-$name.json" >"$RUNNER_TEMP/zap/zap-$name.log" 2>&1
            rc=$?
            summary=$(grep -E '^FAIL-NEW|^WARN-NEW|^PASS' "$RUNNER_TEMP/zap/zap-$name.log" | tail -n1)
            echo "- \`$name\` ($url): rc=$rc · ${summary:-xem log}" >> "$GITHUB_STEP_SUMMARY"
            grep -E '^(FAIL|WARN)-NEW|^WARN|^FAIL' "$RUNNER_TEMP/zap/zap-$name.log" | head -n 20 || true
          done
          exit 0

      - name: Upload báo cáo ZAP
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/zap/
          retention-days: 14
          if-no-files-found: ignore

      - name: Swap slot staging → production (be + fe, đo thời gian)
        id: swap
        run: |
          set -uo pipefail

          # Mặc định false — nếu step chết trước khi kịp ghi lại (không thể xảy
          # ra với luồng dưới đây, nhưng ghi trước cho chắc) thì output vẫn tồn
          # tại thay vì rỗng, bước rollback phía sau đọc an toàn hơn.
          echo "be_swapped=false" >> "$GITHUB_OUTPUT"
          echo "fe_swapped=false" >> "$GITHUB_OUTPUT"

          # HAI swap, KHÔNG nguyên tử với nhau. Azure không có API swap nhiều app
          # một lượt, nên giữa hai lệnh dưới đây luôn tồn tại một khoảng thời gian
          # production chạy lệch phiên bản. Bắt lỗi tường minh từng lệnh — KHÔNG
          # để hai lệnh chạy trần dưới set -e, để biết CHÍNH XÁC app nào đã đổi.
          T0=$(date +%s)

          # Swap `be` TRƯỚC `fe` là có chủ ý: `fe` gọi `be`, nên thứ tự này cho ra
          # cửa sổ "fe cũ gọi be mới" (backend mới thường vẫn phục vụ được client
          # cũ) thay vì "fe mới gọi be cũ" (giao diện mới đòi API chưa tồn tại).
          if ! az webapp deployment slot swap \
               -g rg-vsf-dev -n "$BE_APP" --slot staging --target-slot production; then
            echo "::error::swap be THAT BAI. Production KHONG doi gi ca — ca be lan fe van la ban cu, he thong nhat quan. Khong can rollback."
            exit 1
          fi
          T1=$(date +%s)
          echo "swap-be: $((T1-T0))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"
          # Ghi NGAY sau khi be swap xong: bước rollback (if: failure()) đọc cờ
          # này để biết có cần swap ngược be hay không, kể cả khi bước NÀY sau đó
          # tự exit 1 (do fe swap hỏng) — output ghi trước khi exit vẫn giữ được.
          echo "be_swapped=true" >> "$GITHUB_OUTPUT"

          if ! az webapp deployment slot swap \
               -g rg-vsf-dev -n "$FE_APP" --slot staging --target-slot production; then
            echo "::error::PRODUCTION DANG LECH PHIEN BAN. be da swap sang ban moi, fe swap THAT BAI nen fe production van la ban cu. Buoc rollback ke tiep se swap NGUOC be de tro ve nhat quan."
            exit 1
          fi
          T2=$(date +%s)
          echo "swap-fe: $((T2-T1))s" >> "$GITHUB_WORKSPACE/.cd-timings.txt"
          echo "fe_swapped=true" >> "$GITHUB_OUTPUT"

      # Chỉ chạy nếu swap CẢ HAI thành công (mặc định: step chỉ chạy khi mọi
      # step trước đó xanh — không cần `if:` tường minh).
      - name: Kiểm tra production N=5 lần cách nhau 5s (đúng SHA + health 200)
        id: verify
        run: |
          set -uo pipefail

          BE_URL="https://$BE_APP.azurewebsites.net"
          FE_URL="https://$FE_APP.azurewebsites.net"

          EXPECT_SHA="$GIT_SHA"
          if [ "$SIMULATE_VERIFY_FAILURE" = "true" ]; then
            # Quyết định C (notes/d17-prep.md): CHỈ đọc được true qua
            # workflow_dispatch trên main (xem env ở đầu job) — cố ý so với một
            # SHA SAI để bước này thất bại THẬT, cho nhánh rollback bên dưới
            # chạy thật ít nhất một lần (3 tình huống lỗi khác của guide đều
            # dừng TRƯỚC swap nên không bao giờ chạm tới đây).
            EXPECT_SHA="0000000000000000000000000000000000dead"
            echo "::notice::simulate_verify_failure=true — co y so voi SHA sai ($EXPECT_SHA) de kiem tra nhanh rollback."
          fi

          OK=1
          for i in 1 2 3 4 5; do
            BE_VER_BODY=$(curl -4 -s --max-time 10 "$BE_URL/version" || true)
            BE_HEALTH_CODE=$(curl -4 -s -o /dev/null -w '%{http_code}' --max-time 10 "$BE_URL/health" || true)
            FE_VER_BODY=$(curl -4 -s --max-time 10 "$FE_URL/api/version" || true)
            FE_HEALTH_CODE=$(curl -4 -s -o /dev/null -w '%{http_code}' --max-time 10 "$FE_URL/api/health" || true)

            BE_SHA=$(printf '%s' "$BE_VER_BODY" | jq -r '.sha // empty' 2>/dev/null || true)
            FE_SHA=$(printf '%s' "$FE_VER_BODY" | jq -r '.sha // empty' 2>/dev/null || true)

            echo "$(date -Is) verify #$i be.sha=$BE_SHA(expect $EXPECT_SHA) be.health=$BE_HEALTH_CODE fe.sha=$FE_SHA fe.health=$FE_HEALTH_CODE"

            if [ "$BE_SHA" != "$EXPECT_SHA" ] || [ "$BE_HEALTH_CODE" != "200" ] \
               || [ "$FE_SHA" != "$EXPECT_SHA" ] || [ "$FE_HEALTH_CODE" != "200" ]; then
              OK=0
              break
            fi
            sleep 5
          done

          if [ "$OK" -ne 1 ]; then
            echo "::error::kiem tra production sau swap THAT BAI o lan #$i — se swap NGUOC o buoc ke tiep."
            exit 1
          fi
          echo "production dang o SHA $GIT_SHA, dat 5/5 lan kiem lien tiep."

      # Chạy khi: (a) swap fe hỏng SAU KHI be đã swap (be_swapped=true,
      # fe_swapped=false — chỉ swap ngược be), hoặc (b) kiểm production thất
      # bại sau khi CẢ HAI đã swap (be_swapped=fe_swapped=true — swap ngược cả
      # hai, fe TRƯỚC rồi be, P6: chỉ swap ngược app ĐÃ swap). `failure()` cũng
      # đúng cho các lỗi KHÔNG liên quan (vd IP runner sai dạng) — điều kiện
      # `be_swapped == 'true'` lọc bỏ đúng những trường hợp đó (step `swap`
      # chưa từng chạy tới nên output rỗng, không phải 'true').
      - name: Rollback — swap ngược app đã swap, fe trước rồi be
        id: rollback
        if: failure() && steps.swap.outputs.be_swapped == 'true'
        env:
          FE_SWAPPED: ${{ steps.swap.outputs.fe_swapped }}
        run: |
          set -uo pipefail
          # rolled_back = ĐÃ THỬ swap ngược; rollback_ok = swap ngược THÀNH CÔNG.
          # Tách hai cờ: nếu chính lệnh swap ngược hỏng mà summary vẫn in "đã
          # rollback, production về bản cũ" thì người vận hành bị báo sai đúng
          # lúc production đang ở trạng thái không xác định.
          echo "rolled_back=true" >> "$GITHUB_OUTPUT"
          FAIL=0

          if [ "$FE_SWAPPED" = "true" ]; then
            echo "fe da swap truoc do — swap NGUOC fe (production ve ban cu)"
            if ! az webapp deployment slot swap \
                 -g rg-vsf-dev -n "$FE_APP" --slot staging --target-slot production; then
              echo "::error::SWAP NGUOC fe THAT BAI — production dang o TRANG THAI KHONG XAC DINH, phai vao Portal kiem tay ngay."
              FAIL=1
            fi
          else
            echo "fe CHUA tung swap trong lan chay nay — khong dung toi (P6, khong swap nguoc app chua swap)"
          fi

          echo "swap NGUOC be (production ve ban cu)"
          if ! az webapp deployment slot swap \
               -g rg-vsf-dev -n "$BE_APP" --slot staging --target-slot production; then
            echo "::error::SWAP NGUOC be THAT BAI — production dang o TRANG THAI KHONG XAC DINH, phai vao Portal kiem tay ngay."
            FAIL=1
          fi

          if [ "$FAIL" -eq 0 ]; then
            echo "rollback_ok=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$FAIL"

      # if: always() — LUÔN chạy, kể cả khi mọi bước trên đỏ hoặc job bị huỷ
      # (huỷ bình thường qua GitHub UI/API; KHÔNG chạy nếu runner chết hẳn —
      # điều 4, notes/d17-prep.md; lưới cho trường hợp đó là bước quét mồ côi
      # ở job `preflight` + `terraform plan` đọc drift, xem C6 trong prep).
      # KHÔNG phụ thuộc output của step nào có thể chưa chạy — BE_APP/FE_APP/
      # RULE_NAME đều là job-level env (từ needs.preflight + github context),
      # luôn có giá trị ngay từ đầu job.
      - name: Xoá luật access restriction tạm (4 bề mặt) — LUÔN chạy
        id: cleanup
        if: always()
        run: |
          set -uo pipefail
          for SURFACE in be be-staging fe fe-staging; do
            case "$SURFACE" in
              be) APP="$BE_APP"; SLOT_ARGS=() ;;
              be-staging) APP="$BE_APP"; SLOT_ARGS=(--slot staging) ;;
              fe) APP="$FE_APP"; SLOT_ARGS=() ;;
              fe-staging) APP="$FE_APP"; SLOT_ARGS=(--slot staging) ;;
            esac
            # Tự chịu lỗi: luật có thể chưa từng được thêm (fail sớm ở bước "Thêm
            # luật" hoặc job dừng trước đó) — remove trên rule không tồn tại trả
            # lỗi, KHÔNG được để nó làm hỏng lượt xoá của 3 bề mặt còn lại.
            az webapp config access-restriction remove \
              -g rg-vsf-dev -n "$APP" "${SLOT_ARGS[@]}" --rule-name "$RULE_NAME" \
              || echo "::warning::khong xoa duoc luat $RULE_NAME tren $SURFACE (co the chua ton tai) — kiem lai o buoc doc lai ben duoi."
          done

          # "Xoá báo thành công" KHÔNG phải bằng chứng — đọc lại mới là bằng
          # chứng thật (điều 4, notes/d17-prep.md). FAIL job nếu còn SÓT bất kỳ
          # luật cd-<run_id>-<run_attempt> nào: đây là lỗ hổng whitelist M6, phải
          # lộ ra ngay, không được lặng lẽ trôi qua.
          LEFTOVER=0
          for SURFACE in be be-staging fe fe-staging; do
            case "$SURFACE" in
              be) APP="$BE_APP"; SLOT_ARGS=() ;;
              be-staging) APP="$BE_APP"; SLOT_ARGS=(--slot staging) ;;
              fe) APP="$FE_APP"; SLOT_ARGS=() ;;
              fe-staging) APP="$FE_APP"; SLOT_ARGS=(--slot staging) ;;
            esac
            REMAIN=$(az webapp config access-restriction show \
              -g rg-vsf-dev -n "$APP" "${SLOT_ARGS[@]}" \
              --query "ipSecurityRestrictions[?name=='$RULE_NAME'].name" -o tsv 2>/dev/null || true)
            if [ -n "$REMAIN" ]; then
              echo "::error::luat $RULE_NAME VAN CON tren $SURFACE sau khi xoa — go tay ngay tren Portal/az, day la lo hong whitelist M6."
              LEFTOVER=1
            fi
          done
          exit "$LEFTOVER"

      # if: always() — bước này PHẢI chạy cả khi các bước trên lỗi. Đó chính là
      # lúc người vận hành cần bảng tóm tắt nhất.
      - name: Ghi job summary
        if: always()
        env:
          WAITED_SECONDS: ${{ steps.poll.outputs.waited_seconds }}
          POLL_OK: ${{ steps.poll.outputs.poll_ok }}
          SWAP_RESULT: ${{ steps.swap.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          ROLLED_BACK: ${{ steps.rollback.outputs.rolled_back }}
          ROLLBACK_OK: ${{ steps.rollback.outputs.rollback_ok }}
          RUNNER_IP: ${{ steps.runner-ip.outputs.ip }}
        run: |
          set -uo pipefail
          {
            echo "### CD — swap staging → production (D17)"
            echo ""
            echo "- Runner IP: \`${RUNNER_IP:-(khong lay duoc)}\`"
            echo "- Chờ staging sẵn sàng: \`${WAITED_SECONDS:-?}\`s (poll_ok=\`${POLL_OK:-false}\`)"
            echo "- SHA: \`$GIT_SHA\`"
            if [ "${ROLLED_BACK:-}" = "true" ] && [ "${ROLLBACK_OK:-}" != "true" ]; then
              echo ""
              echo "> 🛑 **ROLLBACK THẤT BẠI.** Đã thử swap ngược nhưng ít nhất một lệnh swap ngược lỗi —"
              echo "> production đang ở **trạng thái không xác định**. Kiểm tay ngay: \`/version\` của be và \`/api/version\` của fe."
            elif [ "${ROLLED_BACK:-}" = "true" ]; then
              echo ""
              echo "> ⚠️ **ĐÃ ROLLBACK.** Swap fe thất bại sau khi be đã swap, hoặc kiểm tra production sau swap thất bại."
              echo "> Production hiện KHÔNG ở SHA \`$GIT_SHA\` — đã swap ngược về bản trước lần chạy này."
            elif [ "${VERIFY_RESULT:-}" = "success" ]; then
              echo "- Kiểm tra production: **ĐẠT** (5/5 lần) — production đang ở SHA \`$GIT_SHA\`."
            elif [ "${POLL_OK:-}" != "true" ]; then
              echo "- Poll staging hết giờ — **KHÔNG swap**. Production không đổi gì so với trước lần chạy này."
            else
              echo "- Kết quả chưa rõ ràng, xem log từng bước ở trên."
            fi
            echo ""
            echo "| Bước | Thời gian |"
            echo "|---|---|"
            if [ -s "$GITHUB_WORKSPACE/.cd-timings.txt" ]; then
              while IFS=: read -r STEP SECS; do
                echo "|$STEP |$SECS |"
              done < "$GITHUB_WORKSPACE/.cd-timings.txt"
            else
              echo "| (chưa bước nào xong) | — |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
