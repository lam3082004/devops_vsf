name: CI

# Chạy trên PR vào main. KHÔNG deploy gì ở đây — deploy là việc của cd.yml (D16).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Token chỉ cần đọc nội dung repo.
permissions:
  contents: read

# Có commit mới trên cùng PR thì huỷ run cũ, đỡ tốn phút chạy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # Phải lấy TOÀN BỘ lịch sử: secret nằm ở commit giữa PR vẫn phải bị bắt.
          fetch-depth: 0
      # Chạy thẳng binary thay vì gitleaks-action: action đó muốn bình luận vào PR
      # nên đòi quyền pull-requests:write. Cách này giữ token ở mức chỉ đọc.
      # Version ghim cứng để build tái lập được; nâng cấp là một PR riêng.
      - name: Cài gitleaks ${{ env.GITLEAKS_VERSION }}
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Quét secret trong toàn bộ lịch sử
        run: gitleaks detect --redact -v --exit-code 1

  dotnet:
    name: dotnet (format, build, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Cài .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet format app/NodeRegistry.csproj --verify-no-changes --severity warn
      - run: dotnet build app/NodeRegistry.csproj -c Release
      - run: dotnet test app.Tests/NodeRegistry.Tests.csproj -c Release

  terraform:
    name: terraform (fmt, validate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Bỏ qua nếu chưa có thư mục infra/ (sẽ có từ D7)
        id: check
        run: test -d infra && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.exists == 'true'
        with:
          terraform_version: 1.15.8
      - name: terraform fmt
        if: steps.check.outputs.exists == 'true'
        run: terraform -chdir=infra fmt -check -recursive
      # validate phải chạy trong TỪNG root module: thư mục infra/ không có file .tf
      # nên validate ở đó luôn xanh mà không kiểm gì.
      - name: terraform validate
        if: steps.check.outputs.exists == 'true'
        run: |
          for dir in infra/*/; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  azure-oidc:
    name: azure login (OIDC)
    runs-on: ubuntu-24.04
    # Chỉ job này cần id-token. Khai ở CẤP JOB, không phải cấp workflow:
    # permissions cấp workflow áp cho mọi job, mà 3 job kia không cần token OIDC.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      # Không có client secret nào: GitHub cấp token ngắn hạn có chữ ký, Entra
      # chấp nhận nếu subject của token khớp federated credential đã khai
      # (repo:lam3082004/devops_vsf:pull_request cho danh tính plan).
      - name: Đăng nhập Azure bằng OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Kiểm chứng danh tính và quyền
        run: |
          az account show --query "{subscription:name, tenant:tenantId}" -o table
          echo "--- resource group đọc được (quyền Reader):"
          az group list --query "[].name" -o tsv
