name: CI

# Chạy trên PR vào main. KHÔNG deploy gì ở đây — deploy là việc của cd.yml (D16).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Token chỉ cần đọc nội dung repo.
permissions:
  contents: read

# Có commit mới trên cùng PR thì huỷ run cũ, đỡ tốn phút chạy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # Phải lấy TOÀN BỘ lịch sử: secret nằm ở commit giữa PR vẫn phải bị bắt.
          fetch-depth: 0
      # Chạy thẳng binary thay vì gitleaks-action: action đó muốn bình luận vào PR
      # nên đòi quyền pull-requests:write. Cách này giữ token ở mức chỉ đọc.
      # Version ghim cứng để build tái lập được; nâng cấp là một PR riêng.
      - name: Cài gitleaks ${{ env.GITLEAKS_VERSION }}
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Quét secret trong toàn bộ lịch sử
        run: gitleaks detect --redact -v --exit-code 1

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - name: Cài toolchain Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy --no-self-update
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  terraform:
    name: terraform (fmt, validate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Bỏ qua nếu chưa có thư mục infra/ (sẽ có từ D7)
        id: check
        run: test -d infra && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.exists == 'true'
        with:
          terraform_version: 1.15.8
      - name: terraform fmt
        if: steps.check.outputs.exists == 'true'
        run: terraform -chdir=infra fmt -check -recursive
      - name: terraform validate
        if: steps.check.outputs.exists == 'true'
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate
