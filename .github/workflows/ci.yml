name: CI

# Chạy trên PR vào main. KHÔNG deploy gì ở đây — deploy là việc của cd.yml (D16).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Token chỉ cần đọc nội dung repo.
permissions:
  contents: read

# Có commit mới trên cùng PR thì huỷ run cũ, đỡ tốn phút chạy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # Phải lấy TOÀN BỘ lịch sử: secret nằm ở commit giữa PR vẫn phải bị bắt.
          fetch-depth: 0
      # Chạy thẳng binary thay vì gitleaks-action: action đó muốn bình luận vào PR
      # nên đòi quyền pull-requests:write. Cách này giữ token ở mức chỉ đọc.
      # Version ghim cứng để build tái lập được; nâng cấp là một PR riêng.
      - name: Cài gitleaks ${{ env.GITLEAKS_VERSION }}
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Quét secret trong toàn bộ lịch sử
        run: gitleaks detect --redact -v --exit-code 1

  dotnet:
    name: dotnet (format, build, test)
    runs-on: ubuntu-24.04
    # MySQL thật cho be.Tests (BE-5): bộ test hiện tại không chạm DB, nên mọi
    # lỗi SQL chỉ lộ khi chạy thật. RequiresMySqlFactAttribute tự skip nếu
    # thiếu TEST_DB_HOST — service container này cấp đúng biến đó cho step
    # `dotnet test` bên dưới.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpass      # DB dùng một lần trong runner, không phải secret
          MYSQL_DATABASE: opsboard_test
        ports: ["3306:3306"]
        # Thiếu health check thì step test chạy trước lúc MySQL nhận kết nối → đỏ ngẫu nhiên.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptestpass"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - name: Cài .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet format app/be/OpsBoard.csproj --verify-no-changes --severity warn
      - run: dotnet build app/be/OpsBoard.csproj -c Release
      - run: dotnet test app/be.Tests/OpsBoard.Tests.csproj -c Release
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASSWORD: testpass
          TEST_DB_NAME: opsboard_test
          # CI=true đã được GitHub Actions tự đặt sẵn — không khai lại ở đây.

  frontend:
    name: frontend (lint, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          # Ghim major: Next 16 cần Node >= 20, máy dev đang dùng 24.
          node-version: "24"
          # Cache ~/.npm theo package-lock.json — cache-dependency-path phải
          # trỏ đúng file vì lock nằm trong app/fe, không phải gốc repo.
          cache: npm
          cache-dependency-path: app/fe/package-lock.json
      # `ci` chứ không phải `install`: cài đúng cây phụ thuộc trong lock file
      # và đỏ nếu package.json lệch lock — build phải tái lập được.
      - run: npm --prefix app/fe ci
      - run: npm --prefix app/fe run lint
      # D17: node:test, không dependency mới (known-issues.md #16). Chạy TRƯỚC build —
      # test đọc thẳng src/lib/health.ts (Node tự strip type), không cần build trước.
      - run: npm --prefix app/fe run test
      # Build cũng là bước kiểm kiểu: `next build` chạy tsc, lỗi type → PR đỏ.
      - run: npm --prefix app/fe run build

      # CỔNG chặn tái phát #46: lúc `next build` trong Docker không có API_BASE_URL,
      # requireBaseUrl() ném lỗi TRƯỚC khi fetch no-store kịp chạy → Next không thấy tín hiệu
      # dynamic, prerender TĨNH trang kèm banner lỗi rồi cache 1 năm (s-maxage=31536000) — runtime
      # không bao giờ gọi backend nữa. Sửa ở PR #46 bằng `await connection()` đầu `request()`
      # (`src/lib/api.ts`); cổng này đọc `.next/prerender-manifest.json` và fail nếu còn route nào
      # (ngoài route nội bộ `/_...` và asset tĩnh `/favicon.ico`) bị prerender tĩnh — mọi trang thật
      # của app đều đọc backend nên phải render lúc request.
      - name: Cổng chặn route đọc backend bị prerender tĩnh (tái phát #46)
        run: |
          node -e '
          var fs = require("fs");
          var manifest = JSON.parse(fs.readFileSync("app/fe/.next/prerender-manifest.json", "utf8"));
          var routes = Object.keys(manifest.routes || {});
          var bad = routes.filter(function (r) { return r !== "/favicon.ico" && r.indexOf("/_") !== 0; });
          if (bad.length > 0) {
            bad.forEach(function (r) {
              console.log(
                "::error::route " + r + " bi prerender TINH (prerender-manifest.json)" +
                " — moi trang cua app deu doc backend, phai render luc request, khong duoc cache." +
                " Dung bug #46 (thieu await connection() truoc requireBaseUrl() trong src/lib/api.ts," +
                " hoac thieu export const dynamic = force-dynamic o route handler moi)." +
                " Xem PR #46, known-issues.md #18."
              );
            });
            process.exit(1);
          }
          console.log("OK - " + routes.length + " route tinh, toan bo la noi bo (_...) hoac favicon.ico: " + routes.join(", "));
          '

  terraform:
    name: terraform (fmt, validate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Bỏ qua nếu chưa có thư mục infra/ (sẽ có từ D7)
        id: check
        run: test -d infra && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.exists == 'true'
        with:
          terraform_version: 1.15.8
      - name: terraform fmt
        if: steps.check.outputs.exists == 'true'
        run: terraform -chdir=infra fmt -check -recursive
      # validate phải chạy trong TỪNG root module: thư mục infra/ không có file .tf
      # nên validate ở đó luôn xanh mà không kiểm gì.
      - name: terraform validate
        if: steps.check.outputs.exists == 'true'
        run: |
          for dir in infra/*/; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  terraform-plan:
    name: terraform plan (infra/app)
    runs-on: ubuntu-24.04
    # Chỉ chạy khi fmt/validate đã xanh — khỏi tốn API call Azure cho code
    # còn sai cú pháp.
    needs: terraform
    permissions:
      id-token: write
      contents: read
    # Nhóm RIÊNG với concurrency ở đầu file (group: ci-${{ github.ref }}):
    # 2 PR chạy song song vẫn có thể cùng chạm state của infra/app (plan cũng
    # lấy lease trên state, xem D7) — nhóm theo tên cố định để job sau chờ
    # job trước thay vì tranh lock và fail.
    concurrency:
      group: terraform-plan-infra-app
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: terraform init
        run: terraform -chdir=infra/app init -backend-config=backend.hcl
        # Provider azurerm + backend azurerm đều tự nhận OIDC qua các biến
        # ARM_* này (không cần bước azure/login riêng cho Terraform).
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
      - name: terraform plan
        id: plan
        # rg-vsf-dev thường TRỐNG (kỷ luật make down cuối buổi, D8) — lúc đó
        # firewall MySQL (for_each trên possible outbound IP của Web App,
        # db.tf) không plan được vì Web App còn chưa tồn tại để biết IP
        # (Invalid for_each argument, xem notes/d8.md). Soi state trước, giống
        # hệt cách Makefile `up` xử lý pha 1/2 — plan pha 1 (chỉ Web App) khi
        # môi trường đang tắt, thay vì để cả job đỏ oan mỗi sáng.
        run: |
          if terraform -chdir=infra/app state list 2>/dev/null | grep -qx 'azurerm_linux_web_app.app'; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            terraform -chdir=infra/app plan -no-color -input=false -out=tfplan
          else
            echo "scope=partial" >> "$GITHUB_OUTPUT"
            echo "::notice::rg-vsf-dev dang trong (moi truong da make down) — chi plan duoc pha 1 (Web App). Muon xem plan day du, chay 'make up' roi mo lai PR nay (hoac re-run job)."
            terraform -chdir=infra/app plan -no-color -input=false -target=azurerm_linux_web_app.app -out=tfplan
          fi
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
      - name: Chuyển plan sang bản text đọc được trong PR
        # Chỉ file TEXT được upload — file nhị phân tfplan chứa giá trị secret
        # (mysql-admin-password) ở dạng đọc được, không được rời khỏi runner.
        run: terraform -chdir=infra/app show -no-color tfplan > infra/app/plan.txt
      - name: Tóm tắt vào job summary
        run: |
          {
            echo "### Terraform plan — infra/app"
            if [ "${{ steps.plan.outputs.scope }}" = "partial" ]; then
              echo "> ⚠️ Môi trường đang tắt (rg-vsf-dev trống) — đây chỉ là plan pha 1 (Web App), CHƯA đầy đủ. Chạy \`make up\` rồi re-run job để xem plan toàn bộ."
            fi
            echo '```'
            grep -E '^(Plan:|No changes)' infra/app/plan.txt || echo "(không thấy dòng tóm tắt, xem plan.txt đầy đủ trong artifact)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload plan.txt làm artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-app
          path: infra/app/plan.txt
          retention-days: 14

  # Hai job dưới đây build image rồi quét NGAY trong cùng job. Không tách
  # "build" và "scan" thành hai job: image nằm trong docker daemon của runner,
  # job khác không thấy nó — tách ra thì hoặc phải docker save/load qua artifact,
  # hoặc (bẫy thường gặp) Trivy lặng lẽ kéo một image cùng tên từ Internet về
  # quét, báo xanh cho thứ không phải bản vừa build.
  docker-build-be:
    name: docker build + trivy (be)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # KHÔNG push. PR đến từ nhánh bất kỳ; push nghĩa là cho code chưa review
      # ghi vào registry mà production kéo từ đó. Push là việc của cd.yml (D16),
      # sau khi đã merge vào main.
      - name: docker build (be)
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t opsboard-be:${{ github.sha }} \
            app/be/
      # Cache database CVE để job không đỏ vì mạng và không tải lại ~700MB mỗi
      # lần. Khoá theo NGÀY: database đổi liên tục, giữ quá lâu là quét bằng dữ
      # liệu cũ và bỏ lọt CVE mới.
      - name: Cache database Trivy
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-
      # Chạy thẳng binary thay vì trivy-action, cùng lý do như gitleaks ở trên:
      # giữ token ở mức chỉ đọc và ghim version để kết quả tái lập được.
      - name: Cài trivy ${{ env.TRIVY_VERSION }}
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          curl -sSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version
      # Bảng đầy đủ để đọc, KHÔNG làm đỏ job: MEDIUM/LOW là thông tin theo dõi
      # drift, không phải cổng. Chính sách cổng nằm ở bước sau.
      - name: Trivy — bảng đầy đủ (không phải cổng)
        run: |
          trivy image --scanners vuln --severity CRITICAL,HIGH,MEDIUM,LOW \
            --timeout 10m --no-progress opsboard-be:${{ github.sha }} \
            | tee /tmp/trivy-be-full.txt
          {
            echo "### Trivy — be (mọi mức độ, chỉ để đọc)"
            echo '```'
            grep -E '^Total' /tmp/trivy-be-full.txt || echo "0 CVE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # CỔNG. Không có continue-on-error ở đây, và đó là cả điểm của bước này:
      # bước quét lỗi vì BẤT KỲ lý do gì — mạng hỏng, không tải được database,
      # timeout — phải làm job ĐỎ. continue-on-error biến cổng bảo mật thành đồ
      # trang trí: vẫn hiện trong tab Checks, vẫn xanh, nhưng không chặn gì.
      # Chính sách (Q4, chốt D14 bằng số đo thật): CRITICAL,HIGH và KHÔNG
      # --ignore-unfixed. Cả hai image đo ra 0 ở mức này nên không cần cửa thoát;
      # thêm --ignore-unfixed lúc này chỉ làm cổng yếu đi mà không đổi màu gì.
      # Buộc phải bỏ qua một CVE → .trivyignore kèm mã CVE + lý do + ngày xem lại.
      - name: Trivy — cổng CRITICAL/HIGH
        run: |
          trivy image --scanners vuln --severity CRITICAL,HIGH \
            --exit-code 1 --timeout 10m --no-progress \
            opsboard-be:${{ github.sha }}

  docker-build-fe:
    name: docker build + trivy (fe)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # --build-arg GIT_SHA giống hệt cd.yml: image quét ở CI phải build bằng
      # đúng lệnh mà CD sẽ dùng, nếu không thì cái được quét không phải cái được
      # deploy (bẫy "build trong CD khác bản đã test ở CI").
      - name: docker build (fe)
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t opsboard-fe:${{ github.sha }} \
            app/fe/
      - name: Cache database Trivy
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Cài trivy ${{ env.TRIVY_VERSION }}
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          curl -sSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version
      - name: Trivy — bảng đầy đủ (không phải cổng)
        run: |
          trivy image --scanners vuln --severity CRITICAL,HIGH,MEDIUM,LOW \
            --timeout 10m --no-progress opsboard-fe:${{ github.sha }} \
            | tee /tmp/trivy-fe-full.txt
          {
            echo "### Trivy — fe (mọi mức độ, chỉ để đọc)"
            echo '```'
            grep -E '^Total' /tmp/trivy-fe-full.txt || echo "0 CVE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Trivy — cổng CRITICAL/HIGH
        run: |
          trivy image --scanners vuln --severity CRITICAL,HIGH \
            --exit-code 1 --timeout 10m --no-progress \
            opsboard-fe:${{ github.sha }}

  # DevSecOps (người dùng duyệt 01/10): hai lớp chưa có trước đó — SAST cho code
  # và quét misconfig cho IaC/Dockerfile. Repo private không có GitHub Advanced
  # Security nên không dùng CodeQL/code scanning; kết quả nằm ở log + summary.
  # CỔNG giống Trivy image: không continue-on-error; ngoại lệ phải nằm trong code
  # (`nosemgrep: <rule> -- lý do`) hoặc .trivyignore kèm lý do — có review qua PR.
  security-scan:
    name: sast + iac (semgrep, trivy config)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Semgrep chạy bằng image chính thức ghim version (không pip install trên
      # runner). Rule pack tải từ registry công khai, --metrics=off. Chỉ ERROR là
      # cổng; WARNING (ví dụ action chưa ghim SHA) in ra để theo dõi.
      - name: Semgrep SAST (C#, TS/Next.js, Dockerfile, Actions)
        env:
          SEMGREP_IMAGE: semgrep/semgrep:1.177.0
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan \
            --config p/csharp --config p/typescript --config p/nextjs \
            --config p/dockerfile --config p/github-actions \
            --metrics=off --exclude docs --severity ERROR --severity WARNING \
            --json --output semgrep.json app .github || true
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep.json)
          warnings=$(jq '[.results[] | select(.extra.severity == "WARNING")] | length' semgrep.json)
          {
            echo "### Semgrep: $errors ERROR (cổng) · $warnings WARNING (theo dõi)"
            echo
            jq -r '.results[] | "- `\(.extra.severity)` \(.check_id | split(".") | last) — \(.path):\(.start.line)"' semgrep.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results[] | "\(.extra.severity) \(.check_id) \(.path):\(.start.line) \(.extra.message | .[0:160])"' semgrep.json
          # semgrep.json phải parse được: nếu Semgrep chết (mạng, rule pack) thì jq ở
          # trên đã lỗi và set -e của bash mặc định làm bước này đỏ — đúng ý cổng.
          test "$errors" -eq 0
      - name: Cài trivy ${{ env.TRIVY_VERSION }}
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          curl -sSL -o /tmp/trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install /tmp/trivy /usr/local/bin/trivy
          trivy --version
      # Misconfig Terraform (2 root) + 2 Dockerfile. Ngoại lệ có chủ đích: .trivyignore
      # (AVD-AZU-0012 storage state, AVD-AZU-0013 Key Vault — cần Private Endpoint).
      - name: Trivy config — cổng misconfig HIGH/CRITICAL (Terraform, Dockerfile)
        run: |
          trivy config --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs app/fe/node_modules .

  azure-oidc:
    name: azure login (OIDC)
    runs-on: ubuntu-24.04
    # Chỉ job này cần id-token. Khai ở CẤP JOB, không phải cấp workflow:
    # permissions cấp workflow áp cho mọi job, mà các job còn lại không cần token OIDC.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      # Không có client secret nào: GitHub cấp token ngắn hạn có chữ ký, Entra
      # chấp nhận nếu subject của token khớp federated credential đã khai
      # (repo:lam3082004/devops_vsf:pull_request cho danh tính plan).
      - name: Đăng nhập Azure bằng OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Kiểm chứng danh tính và quyền
        run: |
          az account show --query "{subscription:name, tenant:tenantId}" -o table
          echo "--- resource group đọc được (quyền Reader):"
          az group list --query "[].name" -o tsv
